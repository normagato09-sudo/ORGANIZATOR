<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi día</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg: #F5F7F1;
  --surface: #FFFFFF;
  --surface-2: #ECF1E7;
  --ink: #202A20;
  --muted: #75846F;
  --line: #E2E8DC;
  --coral: #F2545B;
  --coral-soft: #FDE4E1;
  --gold: #F0A93B;
  --gold-soft: #FCEBD0;
  --teal: #1FA98D;
  --teal-soft: #DDF1E9;
  --lav: #8D7FE0;
  --lav-soft: #EAE6FA;
  --red: #E5484D;
  --red-soft: #FBDEDE;
  --orange: #F0913B;
  --orange-soft: #FCE9D3;
  --yellow: #E8C13D;
  --yellow-soft: #FBF2D0;
  --green: #4CAF7D;
  --green-soft: #DFF3E7;
  --radius-lg: 22px;
  --radius-md: 14px;
  --radius-sm: 9px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{height:100%;}
body{margin:0; background: var(--bg); color: var(--ink); font-family:'Inter', sans-serif; display:flex; justify-content:center;}
.app{width:100%; max-width:480px; min-height:100vh; background: var(--bg); position:relative; padding-bottom: 84px;}
.mono{font-family:'IBM Plex Mono', monospace;}
.display{font-family:'Space Grotesk', sans-serif;}

.topbar{display:flex; justify-content:space-between; align-items:center; padding: 22px 20px 6px;}
.topbar .greet{font-family:'Space Grotesk'; font-weight:600; font-size:1.3rem;}
.topbar .date{color:var(--muted); font-size:0.82rem; margin-top:2px;}
.topbar .clock{font-family:'IBM Plex Mono'; color:var(--muted); font-size:0.85rem;}

.screen{display:none; padding: 6px 18px 10px;}
.screen.active{display:block;}

.status-pill{display:inline-flex; align-items:center; gap:6px; background: var(--surface); border:1px solid var(--line); border-radius: 999px; padding:7px 14px; font-size:0.82rem; font-weight:600; color:var(--ink); margin: 6px 0 16px;}
.status-pill.ok{background:var(--teal-soft); color:#0E6E5B; border-color:transparent;}
.status-pill.late{background:var(--coral-soft); color:#B3323A; border-color:transparent;}
.status-pill.busy{background:var(--gold-soft); color:#8A5B0E; border-color:transparent;}

.hero{background: var(--surface); border-radius: var(--radius-lg); padding: 22px; box-shadow: 0 14px 30px -18px rgba(32,42,32,0.25); margin-bottom: 14px; position:relative; overflow:hidden;}
.hero .eyebrow{font-family:'Space Grotesk'; font-weight:600; font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase; color: var(--coral); margin-bottom: 10px;}
.hero-main{display:flex; align-items:center; gap:16px;}
.ring-wrap{position:relative; width:76px; height:76px; flex-shrink:0;}
.ring-wrap svg{width:76px; height:76px; transform: rotate(-90deg);}
.ring-bg{fill:none; stroke: var(--surface-2); stroke-width:8;}
.ring-fg{fill:none; stroke: var(--coral); stroke-width:8; stroke-linecap:round; transition: stroke-dashoffset 0.4s ease;}
.ring-emoji{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:1.6rem;}
.hero-text{flex:1; min-width:0;}
.hero-text .name{font-family:'Space Grotesk'; font-weight:700; font-size:1.22rem; line-height:1.2; margin-bottom:4px;}
.hero-text .time{color:var(--muted); font-size:0.88rem; margin-bottom:6px;}
.hero-text .left{display:inline-block; background: var(--coral-soft); color:#B3323A; font-size:0.78rem; font-weight:600; padding:4px 10px; border-radius:999px;}
.hero-empty{color:var(--muted); font-size:0.95rem; line-height:1.5; padding: 6px 0 2px;}
.hero-actions{display:flex; gap:8px; margin-top:16px;}
.hero-actions button{flex:1;}

.next-card{display:flex; align-items:center; gap:12px; background: var(--surface); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 18px; border:1px solid var(--line);}
.next-card .lbl{font-family:'Space Grotesk'; font-weight:600; font-size:0.68rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--lav); width:64px; flex-shrink:0;}
.next-card .info{flex:1; min-width:0;}
.next-card .info .n{font-weight:600; font-size:0.95rem;}
.next-card .info .t{color:var(--muted); font-size:0.78rem; margin-top:1px;}
.next-card.empty .info{color:var(--muted); font-style:italic; font-weight:400;}

.btn{font-family:'Inter'; font-weight:600; font-size:0.9rem; border:none; border-radius: 999px; padding:12px 18px; cursor:pointer; transition: transform .08s ease, opacity .15s ease; display:inline-flex; align-items:center; justify-content:center; gap:6px;}
.btn:active{transform: scale(0.96);}
.btn-coral{background: var(--coral); color:#fff;}
.btn-ink{background: var(--ink); color:#fff;}
.btn-ghost{background: var(--surface-2); color: var(--ink);}
.btn-outline{background:transparent; border:1px solid var(--line); color:var(--ink);}
.btn-sm{padding:8px 12px; font-size:0.78rem; border-radius:8px;}
.btn-block{width:100%;}

.organize-btn{width:100%; background: linear-gradient(135deg, var(--lav), #6E5CD6); color:#fff; font-family:'Space Grotesk'; font-weight:600; font-size:0.98rem; border:none; border-radius: var(--radius-md); padding:15px; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; margin-bottom:22px; box-shadow: 0 14px 24px -14px rgba(109,92,214,0.6);}
.organize-btn:active{transform: scale(0.98);}

.fab{position:fixed; left:50%; transform:translateX(calc(-240px + 380px)); bottom: 92px; width:56px; height:56px; border-radius:50%; background: var(--ink); color:#fff; border:none; font-size:1.6rem; display:flex; align-items:center; justify-content:center; box-shadow: 0 14px 26px -10px rgba(0,0,0,0.45); cursor:pointer; z-index:20;}

.sec-title{font-family:'Space Grotesk'; font-weight:600; font-size:0.95rem; margin: 4px 0 12px; display:flex; align-items:center; justify-content:space-between;}
.sec-title .count{color:var(--muted); font-weight:500; font-size:0.8rem;}

.day-item{display:flex; align-items:center; gap:12px; padding: 11px 4px; border-bottom:1px solid var(--line);}
.day-item:last-child{border-bottom:none;}
.day-item .time{width:54px; flex-shrink:0; font-family:'IBM Plex Mono'; font-size:0.76rem; color:var(--muted);}
.day-item .emoji{font-size:1.15rem; width:26px; text-align:center; flex-shrink:0;}
.day-item .txt{flex:1; min-width:0;}
.day-item .txt .n{font-size:0.92rem; font-weight:500;}
.day-item.done .txt .n{color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line);}
.day-item.missed .emoji{opacity:0.5;}
.day-item.break-item .txt .n{color:var(--muted); font-style:italic; font-weight:400;}

.task-card{background: var(--surface); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 10px; border:1px solid var(--line); position:relative;}
.task-card.done{opacity:0.55;}
.task-card.now-active{border-color: var(--coral); box-shadow: 0 8px 20px -14px rgba(242,84,91,0.5);}
.task-card .top{display:flex; align-items:center; gap:10px;}
.task-card .emoji{font-size:1.3rem;}
.task-card .n{font-family:'Space Grotesk'; font-weight:600; font-size:1rem; flex:1;}
.task-card .meta{color:var(--muted); font-size:0.78rem; margin-top:6px; font-family:'IBM Plex Mono'; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.pill-priority{font-size:0.68rem; font-weight:600; padding:2px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:0.03em; font-family:'Inter';}
.pill-priority.urgente{background: var(--red-soft); color:#A5262B;}
.pill-priority.alta{background: var(--orange-soft); color:#8A5310;}
.pill-priority.normal{background: var(--yellow-soft); color:#7A6109;}
.pill-priority.baja{background: var(--green-soft); color:#1F6B45;}
.pill-cat{font-size:0.68rem; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--muted); font-family:'Inter';}
.pill-deadline{font-size:0.68rem; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--lav-soft); color:#4E3FB0; font-family:'Inter';}
.task-card .actions{display:flex; gap:8px; margin-top:12px;}
.subtask-note{font-size:0.72rem; color:var(--muted); margin-top:6px;}

.pending-card{background: var(--surface); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom:10px; border:1px solid var(--line);}
.pending-card .row1{display:flex; align-items:center; gap:8px;}
.pending-card input[type=text]{flex:1; border:none; background:transparent; font-family:'Space Grotesk'; font-weight:600; font-size:0.95rem; color:var(--ink); outline:none;}
.pending-card .row2{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center;}
.pending-card select, .pending-card input[type=number], .pending-card input[type=date]{background: var(--surface-2); border:none; border-radius:7px; padding:5px 8px; font-family:'IBM Plex Mono'; font-size:0.72rem; color:var(--ink);}
.pending-card .fixed-tag{background:var(--lav-soft); color:#4E3FB0; font-family:'IBM Plex Mono'; font-size:0.68rem; padding:4px 8px; border-radius:7px;}
.pending-card .recur-tag{background:var(--teal-soft); color:#0E6E5B; font-family:'Inter'; font-weight:600; font-size:0.68rem; padding:4px 8px; border-radius:7px;}
.pending-card .rm{background:none; border:none; color:var(--coral); font-size:1.1rem; cursor:pointer; padding:2px 4px;}

.postponed-block{margin-top:18px;}
.postponed-item{display:flex; align-items:center; gap:10px; background:var(--surface-2); border-radius:var(--radius-sm); padding:9px 12px; margin-bottom:8px; font-size:0.85rem;}
.postponed-item .n{flex:1;}
.postponed-item button{font-size:0.7rem; font-family:'Inter'; font-weight:600; background:var(--surface); border:1px solid var(--line); border-radius:7px; padding:5px 8px; cursor:pointer;}

.empty-state{text-align:center; padding: 34px 18px; color:var(--muted); font-size:0.92rem; line-height:1.6;}
.empty-state .ee{font-size:2.1rem; display:block; margin-bottom:10px;}

.progress-card{background:var(--surface); border-radius:var(--radius-lg); padding:22px; text-align:center; border:1px solid var(--line); margin-bottom:14px;}
.progress-num{font-family:'Space Grotesk'; font-weight:700; font-size:2.3rem;}
.progress-label{color:var(--muted); font-size:0.85rem; margin-top:2px;}
.progress-bar-bg{background:var(--surface-2); border-radius:999px; height:10px; margin-top:16px; overflow:hidden;}
.progress-bar-fg{background: linear-gradient(90deg, var(--teal), #38D9A9); height:100%; border-radius:999px; transition: width .4s ease;}
.progress-note{font-size:0.85rem; color:var(--muted); margin-top:12px;}

.settings-block{background:var(--surface); border-radius:var(--radius-md); padding:16px; border:1px solid var(--line); margin-bottom:14px;}
.settings-block label{display:block; font-size:0.8rem; color:var(--muted); margin-bottom:5px; margin-top:12px;}
.settings-block label:first-child{margin-top:0;}
.settings-block input{width:100%; background:var(--surface-2); border:none; border-radius:8px; padding:10px 12px; font-family:'IBM Plex Mono'; font-size:0.9rem; color:var(--ink);}

.bottomnav{position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:480px; background: var(--surface); border-top:1px solid var(--line); display:flex; z-index:15; padding: 8px 4px calc(8px + env(safe-area-inset-bottom));}
.bottomnav button{flex:1; background:none; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; color: var(--muted); font-size:0.65rem; font-family:'Inter'; font-weight:600; padding:5px 0;}
.bottomnav button .ic{font-size:1.2rem;}
.bottomnav button.active{color: var(--coral);}

.modal-backdrop{position:fixed; inset:0; background:rgba(20,26,18,0.45); display:none; align-items:flex-end; justify-content:center; z-index:30;}
.modal-backdrop.open{display:flex;}
.modal-sheet{width:100%; max-width:480px; background: var(--bg); border-radius: 26px 26px 0 0; padding: 20px 20px calc(24px + env(safe-area-inset-bottom)); animation: slideup .2s ease;}
@keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-sheet h3{font-family:'Space Grotesk'; margin:0 0 4px;}
.modal-sheet p.hint{color:var(--muted); font-size:0.85rem; margin:0 0 14px;}
.modal-sheet textarea{width:100%; min-height:100px; border-radius: var(--radius-md); border:1px solid var(--line); background: var(--surface); padding:14px; font-family:'Inter'; font-size:0.95rem; color:var(--ink); resize:vertical; outline:none;}
.modal-actions{display:flex; gap:10px; margin-top:14px;}
.modal-actions .btn{flex:1;}

.preview-list{margin-top:14px; max-height:240px; overflow:auto;}
.preview-item{padding:10px 0; border-bottom:1px solid var(--line); font-size:0.88rem;}
.preview-item .row{display:flex; align-items:center; gap:8px;}
.preview-item .e{font-size:1.05rem;}
.preview-item .badges{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; margin-left:26px;}
.preview-item .badges span{font-size:0.66rem; font-weight:600; padding:2px 7px; border-radius:999px; background:var(--surface-2); color:var(--muted);}
.preview-item .split-toggle{display:flex; align-items:center; gap:6px; margin-top:7px; margin-left:26px; font-size:0.78rem; color:var(--lav); font-weight:600;}

::-webkit-scrollbar{width:0; height:0;}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div>
      <div class="greet display" id="greet">Hola 👋</div>
      <div class="date" id="date-label"></div>
    </div>
    <div class="clock mono" id="clock">--:--</div>
  </div>

  <div class="screen active" id="screen-inicio">
    <div id="status-pill-wrap"></div>
    <div class="hero" id="hero-now"></div>
    <div class="next-card" id="hero-next"></div>
    <button class="organize-btn" id="btn-organize">✨ Organízame</button>
    <div class="sec-title">Mi día <span class="count" id="inicio-day-count"></span></div>
    <div id="inicio-day-list"></div>
  </div>

  <div class="screen" id="screen-dia">
    <div class="sec-title">Mi día completo</div>
    <div id="dia-full-list"></div>
  </div>

  <div class="screen" id="screen-tareas">
    <div class="sec-title">Tareas pendientes <span class="count" id="tareas-count"></span></div>
    <div id="tareas-list"></div>
    <div id="postponed-wrap"></div>
  </div>

  <div class="screen" id="screen-progreso">
    <div class="sec-title">Progreso de hoy</div>
    <div class="progress-card">
      <div class="progress-num display" id="prog-fraction">0/0</div>
      <div class="progress-label">tareas completadas</div>
      <div class="progress-bar-bg"><div class="progress-bar-fg" id="prog-bar" style="width:0%"></div></div>
      <div class="progress-note" id="prog-note">Cuando generes tu plan del día, aquí verás cómo va avanzando.</div>
    </div>
  </div>

  <div class="screen" id="screen-ajustes">
    <div class="sec-title">Ajustes</div>
    <div class="settings-block">
      <label>Me levanto a las</label><input type="time" id="set-wake" value="07:00">
      <label>Me acuesto a las</label><input type="time" id="set-sleep" value="23:30">
      <label>Descanso tras cada tarea (min)</label><input type="number" id="set-break" value="10" min="0" max="60">
      <label>Descanso obligatorio tras (min seguidos)</label><input type="number" id="set-workblock" value="90" min="30" max="240">
    </div>
    <button class="btn btn-ink btn-block" id="btn-save-settings">Guardar ajustes</button>
  </div>

  <button class="fab" id="btn-fab" title="Añadir">+</button>

  <div class="bottomnav">
    <button data-screen="inicio" class="active"><span class="ic">🏠</span>Inicio</button>
    <button data-screen="dia"><span class="ic">📅</span>Mi día</button>
    <button data-screen="tareas"><span class="ic">✅</span>Tareas</button>
    <button data-screen="progreso"><span class="ic">📊</span>Progreso</button>
    <button data-screen="ajustes"><span class="ic">⚙️</span>Ajustes</button>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal-sheet">
      <h3 class="display">Añadir</h3>
      <p class="hint">Escribe lo que tengas en la cabeza, tal cual. Yo lo ordeno.</p>
      <textarea id="inbox" placeholder="Ej: Estudiar matemáticas para el examen del viernes. El jueves a las 18 tengo entrenamiento. Ordenar habitación cada sábado."></textarea>
      <div class="preview-list" id="preview-list"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="btn-modal-close">Cerrar</button>
        <button class="btn btn-coral" id="btn-modal-add">Añadir</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="confirm-modal">
    <div class="modal-sheet">
      <h3 class="display">¿Quieres hacerla más tarde?</h3>
      <p class="hint" id="confirm-text">Esta tarea no se hizo a su hora.</p>
      <div class="modal-actions">
        <button class="btn btn-outline" id="confirm-no">No, dejarla para otro día</button>
        <button class="btn btn-coral" id="confirm-yes">Sí, buscar hueco</button>
      </div>
    </div>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id);

// ---------------- MODEL ----------------
let tasks = [];            // {id,name,category,duration,durationKnown,priority,deadline,deadlineLabel,fixedTime,status,groupId,groupLabel,recurringRuleId}
let recurringRules = [];   // {id,name,category,duration,priority,fixedTime,days:[0-6],lastInstanceDate}
let schedule = [];
let settings = { wake: "07:00", sleep: "23:30", breakMin: 10, workBlock: 90, lastDate: "" };

const CATEGORIES = {
  cole:     {emoji:'📚', label:'Cole',     re:/estudiar|examen|deberes|trabajo de|redacc|ensayo|informe|\bclase\b|matemát|historia|\bleer\b|repasar/i},
  casa:     {emoji:'🏠', label:'Casa',     re:/ordenar|limpiar|habitaci|cocina|lavar|fregar/i},
  personal: {emoji:'👤', label:'Personal', re:/ducha|mochila|preparar|rutina|ropa/i},
  deporte:  {emoji:'🏃', label:'Deporte',  re:/entrenar|gimnasio|ejercicio|entrenamiento|correr|deporte/i},
  compras:  {emoji:'🛒', label:'Compras',  re:/comprar|compra\b/i},
  otros:    {emoji:'💼', label:'Otros',    re:null}
};
const PRIORITY = {
  urgente: {emoji:'🔴', label:'Urgente', w:4},
  alta:    {emoji:'🟠', label:'Alta',    w:3},
  normal:  {emoji:'🟡', label:'Normal',  w:2},
  baja:    {emoji:'🟢', label:'Baja',    w:1}
};
const WEEKDAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DURATION_GUESS = [
  [/estudiar|repasar|examen|matemát/i, 60],
  [/trabajo de|redacc|ensayo|informe|historia/i, 90],
  [/\bleer\b/i, 40],
  [/ordenar|limpiar|habitaci/i, 30],
  [/mochila/i, 15],
  [/entrenar|gimnasio|ejercicio|entrenamiento/i, 75],
  [/cenar|comer|almorzar|desayunar|merend/i, 30],
  [/duch/i, 20],
  [/comprar/i, 40],
];

function detectCategory(text){ for(const k in CATEGORIES){ if(CATEGORIES[k].re && CATEGORIES[k].re.test(text)) return k; } return 'otros'; }
function guessDuration(text){ for(const [re,min] of DURATION_GUESS){ if(re.test(text)) return min; } return 30; }
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function todayIso(){ return fmtDate(new Date()); }

// ---------------- PERSISTENCE ----------------
async function saveState(){
  try{ await window.storage.set('planner-data', JSON.stringify({tasks, schedule, settings, recurringRules})); }
  catch(e){ console.error('No se pudo guardar', e); }
}
async function loadState(){
  try{
    const r = await window.storage.get('planner-data');
    if(r && r.value){
      const d = JSON.parse(r.value);
      tasks = d.tasks || [];
      schedule = d.schedule || [];
      settings = d.settings || settings;
      recurringRules = d.recurringRules || [];
    }
  }catch(e){ /* sin datos previos */ }
  $('set-wake').value = settings.wake;
  $('set-sleep').value = settings.sleep;
  $('set-break').value = settings.breakMin;
  $('set-workblock').value = settings.workBlock;

  const ti = todayIso();
  if(settings.lastDate !== ti){
    instantiateRecurring(ti);
    settings.lastDate = ti;
  }
  saveState();
  renderAll();
}

function instantiateRecurring(ti){
  const dow = new Date().getDay();
  recurringRules.forEach(r=>{
    if(r.days.includes(dow) && r.lastInstanceDate !== ti){
      tasks.push({
        id:'t'+Date.now()+Math.random().toString(36).slice(2,6),
        name:r.name, category:r.category, duration:r.duration, durationKnown:true,
        priority:r.priority, deadline: ti, deadlineLabel:'Hoy', fixedTime:r.fixedTime||null,
        status:'pendiente', recurringRuleId:r.id
      });
      r.lastInstanceDate = ti;
    }
  });
}

// ---------------- PARSING ----------------
function cleanDescription(str){
  return str.replace(/^(y\s+)/i,'').replace(/\b(tengo que|tengo|quiero|debo|hay que|voy a|necesito)\b/gi,'')
    .replace(/\s{2,}/g,' ').trim().replace(/^./, c => c.toUpperCase());
}
function extractDuration(text){
  let m = text.match(/(\d+[.,]?\d*)\s*(horas?|h\b)/i);
  if(m) return {minutes: Math.round(parseFloat(m[1].replace(',','.'))*60), match:m[0]};
  m = text.match(/(\d+)\s*(min|minutos)\b/i);
  if(m) return {minutes: parseInt(m[1],10), match:m[0]};
  return null;
}
function extractPriority(text){
  if(/urgente/i.test(text)) return {level:'urgente', match: text.match(/urgente/i)[0]};
  if(/importante|prioridad alta/i.test(text)) return {level:'alta', match: text.match(/importante|prioridad alta/i)[0]};
  if(/prioridad baja|poco importante/i.test(text)) return {level:'baja', match: text.match(/prioridad baja|poco importante/i)[0]};
  return null;
}
function extractDeadline(text){
  const now = new Date();
  if(/\bhoy\b/i.test(text)) return {iso: fmtDate(now), label:'Hoy', match: text.match(/\bhoy\b/i)[0]};
  if(/\bma[ñn]ana\b/i.test(text)){ const d=new Date(now); d.setDate(d.getDate()+1); return {iso: fmtDate(d), label:'Mañana', match: text.match(/\bma[ñn]ana\b/i)[0]}; }
  for(let i=0;i<7;i++){
    const re = new RegExp('\\b'+WEEKDAYS[i]+'\\b','i');
    const mm = text.match(re);
    if(mm){
      let d=new Date(now); let diff=(i-d.getDay()+7)%7; if(diff===0) diff=7; d.setDate(d.getDate()+diff);
      return {iso: fmtDate(d), label: capitalize(WEEKDAYS[i]), match: mm[0]};
    }
  }
  const dm = text.match(/(\d{1,2}) de (enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)/i);
  if(dm){
    const day=parseInt(dm[1],10), month=MONTHS.indexOf(dm[2].toLowerCase());
    let year=now.getFullYear(); let d=new Date(year,month,day);
    if(d<now) d=new Date(year+1,month,day);
    return {iso: fmtDate(d), label: dm[0], match: dm[0]};
  }
  return null;
}
function extractRecurring(text){
  const found = [];
  WEEKDAYS.forEach((w,i)=>{ if(new RegExp('\\b'+w+'\\b','i').test(text)) found.push(i); });
  const hasCue = /\btodos los\b|\bcada\b/i.test(text);
  if(found.length>=2 || (found.length>=1 && hasCue)) return {days: found.sort()};
  return null;
}
function extractFixedTime(text){
  const m = text.match(/a las?\s*(\d{1,2})(:(\d{2}))?/i);
  if(!m) return null;
  const hh = parseInt(m[1],10), mm = m[3]?parseInt(m[3],10):0;
  return {time: String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'), match:m[0]};
}

function parseToDrafts(text){
  if(!text.trim()) return [];
  const rawClauses = text.split(/(?<=[.;])\s+|\n+/).flatMap(s => s.split(/,(?!\s*\d)/));
  let clauses = [];
  rawClauses.forEach(c => { clauses = clauses.concat(c.split(/\s+y\s+(?=[a-záéíóúñ])/i)); });

  const drafts = [];
  clauses.forEach(clause => {
    clause = clause.trim().replace(/[.;]+$/,'');
    if(!clause) return;
    let working = clause;

    const recurring = extractRecurring(working);
    const fixed = extractFixedTime(working);
    if(fixed) working = working.replace(fixed.match,'');
    const deadline = recurring ? null : extractDeadline(working);
    if(deadline) working = working.replace(deadline.match,'');
    const durationInfo = extractDuration(working);
    if(durationInfo) working = working.replace(durationInfo.match,'');
    const priorityInfo = extractPriority(working);
    if(priorityInfo) working = working.replace(priorityInfo.match,'');
    if(recurring){
      WEEKDAYS.forEach(w=> working = working.replace(new RegExp('\\btodos los '+w+'s?\\b|\\bcada '+w+'\\b|\\b'+w+'\\b','gi'),''));
      working = working.replace(/\btodos los\b|\bcada\b/gi,'');
    }
    working = working.replace(/\btarda unas?\b/gi,'').replace(/\bpara el\b|\bpara\b/gi,'');
    const desc = cleanDescription(working);
    if(!desc) return;

    const category = detectCategory(clause);
    let priority = priorityInfo ? priorityInfo.level : (fixed ? 'alta' : 'normal');
    const duration = durationInfo ? durationInfo.minutes : guessDuration(clause);
    const durationKnown = !!durationInfo;

    drafts.push({
      name: desc, category, duration, durationKnown, priority,
      deadline: deadline ? deadline.iso : null, deadlineLabel: deadline ? deadline.label : '',
      fixedTime: fixed ? fixed.time : null,
      recurringDays: recurring ? recurring.days : null,
      split: false
    });
  });
  return drafts;
}

function splitDraft(draft){
  const parts = [ ['Preparar',0.25], ['Hacer',0.5], ['Revisar',0.25] ];
  return parts.map(([label,frac])=>({
    name: draft.name+' — '+label,
    duration: Math.max(15, Math.round(draft.duration*frac/5)*5)
  }));
}

// ---------------- SCHEDULER ----------------
function toMinutes(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
function toHHMM(mins){ mins=((mins%1440)+1440)%1440; const h=Math.floor(mins/60), m=mins%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
function nowMinutes(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }

function buildSchedule(fromMinutes){
  const wake = toMinutes(settings.wake);
  let sleep = toMinutes(settings.sleep);
  if(sleep<=wake) sleep+=1440;
  const startBound = Math.max(fromMinutes, wake);
  const past = schedule.filter(b=>b.end<=fromMinutes);

  const pending = tasks.filter(t=>t.status==='pendiente'||t.status==='programada');
  pending.forEach(t=>t.status='pendiente');

  const fixed = pending.filter(t=>t.fixedTime).map(t=>{
    let s = toMinutes(t.fixedTime);
    if(s < startBound-60) s += 1440;
    return {task:t, start:s, end:s+t.duration};
  }).sort((a,b)=>a.start-b.start);

  const flexible = pending.filter(t=>!t.fixedTime).sort((a,b)=>{
    const pw = PRIORITY[b.priority].w - PRIORITY[a.priority].w;
    if(pw!==0) return pw;
    if(a.deadline && b.deadline) return a.deadline.localeCompare(b.deadline);
    if(a.deadline) return -1;
    if(b.deadline) return 1;
    return 0;
  });

  const blocks = [];
  let cursor = startBound, sinceBreak = 0;
  const flexQueue = [...flexible];
  function pushBreak(len, cap){
    len = Math.min(len, cap!==undefined?cap:len);
    if(len<=0) return;
    blocks.push({id:'b'+cursor+Math.random().toString(36).slice(2,5), type:'break', name:'Descanso', start:cursor, end:cursor+len, status:'pendiente'});
    cursor += len; sinceBreak = 0;
  }

  for(const fx of fixed){
    while(cursor < fx.start && flexQueue.length){
      const gap = fx.start-cursor;
      if(sinceBreak>=settings.workBlock){ pushBreak(settings.breakMin, gap); if(gap-settings.breakMin<=0) break; continue; }
      const t = flexQueue[0];
      if(t.duration <= gap){
        blocks.push({id:t.id, taskId:t.id, type:'task', name:t.name, start:cursor, end:cursor+t.duration, status:'pendiente'});
        cursor += t.duration; sinceBreak += t.duration; flexQueue.shift();
        if(sinceBreak>=settings.workBlock && (fx.start-cursor)>=settings.breakMin){ pushBreak(settings.breakMin, fx.start-cursor); }
      } else break;
    }
    if(cursor<fx.start) cursor=fx.start;
    blocks.push({id:fx.task.id, taskId:fx.task.id, type:'fixed', name:fx.task.name, start:fx.start, end:fx.end, status:'pendiente'});
    cursor = fx.end; sinceBreak = 0;
  }
  while(cursor<sleep && flexQueue.length){
    if(sinceBreak>=settings.workBlock){ pushBreak(settings.breakMin, sleep-cursor); continue; }
    const t = flexQueue[0];
    if(cursor+t.duration>sleep) break;
    blocks.push({id:t.id, taskId:t.id, type:'task', name:t.name, start:cursor, end:cursor+t.duration, status:'pendiente'});
    cursor += t.duration; sinceBreak += t.duration; flexQueue.shift();
  }

  const scheduledIds = new Set(blocks.filter(b=>b.taskId).map(b=>b.taskId));
  tasks.forEach(t=>{ if(t.status==='pendiente' && scheduledIds.has(t.id)) t.status='programada'; });

  schedule = [...past, ...blocks];
  saveState(); renderAll();
}

// ---------------- ACTIONS ----------------
function markDone(blockId){
  const b = schedule.find(x=>x.id===blockId); if(!b) return;
  b.status='hecho';
  if(b.taskId){ const t=tasks.find(x=>x.id===b.taskId); if(t) t.status='completada'; }
  saveState(); renderAll();
}
let pendingNotDoneBlockId = null;
function askNotDone(blockId){
  const b = schedule.find(x=>x.id===blockId); if(!b) return;
  pendingNotDoneBlockId = blockId;
  $('confirm-text').innerHTML = `"<strong>${escapeHtml(b.name)}</strong>" no se hizo a su hora.`;
  $('confirm-modal').classList.add('open');
}
function resolveNotDone(reschedule){
  const blockId = pendingNotDoneBlockId;
  $('confirm-modal').classList.remove('open');
  pendingNotDoneBlockId = null;
  const b = schedule.find(x=>x.id===blockId); if(!b) return;
  b.status = 'no_realizado';
  if(b.taskId){
    const t = tasks.find(x=>x.id===b.taskId);
    if(t) t.status = reschedule ? 'pendiente' : 'pospuesta';
  }
  buildSchedule(nowMinutes());
}
function removePendingTask(id){ tasks = tasks.filter(t=>t.id!==id); saveState(); renderAll(); }
function reactivateTask(id){ const t=tasks.find(x=>x.id===id); if(t) t.status='pendiente'; saveState(); renderAll(); }

// ---------------- RENDER ----------------
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function catEmoji(t){ return (CATEGORIES[t.category]||CATEGORIES.otros).emoji; }

function computeStatus(){
  const now = nowMinutes();
  const todays = schedule.filter(b=>b.type!=='break');
  const totalCount = todays.length;
  const doneCount = todays.filter(b=>b.status==='hecho').length;
  if(totalCount===0) return {kind:'none'};
  const overdue = todays.find(b=>b.status==='pendiente' && b.end<=now);
  if(overdue) return {kind:'late', minutes: now-overdue.end};
  const totalMinutes = todays.reduce((s,b)=>s+(b.end-b.start),0);
  if(totalMinutes>=360 && doneCount===0) return {kind:'busy'};
  return {kind:'ok', done:doneCount, total:totalCount};
}
function renderStatusPill(){
  const st = computeStatus();
  const wrap = $('status-pill-wrap');
  if(st.kind==='none'){ wrap.innerHTML=''; return; }
  if(st.kind==='late'){ wrap.innerHTML = `<div class="status-pill late">⏱ Vas ${st.minutes} min retrasado</div>`; return; }
  if(st.kind==='busy'){ wrap.innerHTML = `<div class="status-pill busy">💪 Hoy tienes bastante trabajo</div>`; return; }
  wrap.innerHTML = `<div class="status-pill ok">👍 Vas bien · ${st.done} de ${st.total} tareas hechas</div>`;
}
function currentAndNext(){
  const now = nowMinutes();
  const sorted = [...schedule].filter(b=>b.status==='pendiente').sort((a,b)=>a.start-b.start);
  const current = sorted.find(b=>now>=b.start && now<b.end);
  const next = sorted.find(b=>b.start>(current?current.end:now-1));
  return {current, next};
}
function renderHero(){
  const {current, next} = currentAndNext();
  const heroNow = $('hero-now');
  if(!schedule.length){
    heroNow.innerHTML = `<div class="eyebrow">AHORA</div><div class="hero-empty">Aún no tienes un plan para hoy. Toca «+» para contarme qué tienes que hacer, y luego pulsa «Organízame».</div>`;
  } else if(current){
    const now = nowMinutes();
    const frac = Math.min(1, Math.max(0, (now-current.start)/(current.end-current.start)));
    const circumference = 2*Math.PI*42;
    const offset = circumference*(1-frac);
    const remaining = current.end-now;
    heroNow.innerHTML = `
      <div class="eyebrow">AHORA</div>
      <div class="hero-main">
        <div class="ring-wrap">
          <svg viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="42"></circle>
            <circle class="ring-fg" cx="50" cy="50" r="42" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
          </svg>
          <div class="ring-emoji">${current.type==='break' ? '☕' : catEmoji(tasks.find(t=>t.id===current.taskId)||{category:'otros'})}</div>
        </div>
        <div class="hero-text">
          <div class="name">${escapeHtml(current.name)}</div>
          <div class="time mono">${toHHMM(current.start)} — ${toHHMM(current.end)}</div>
          <span class="left">Te quedan ${remaining} min</span>
        </div>
      </div>
      ${current.type!=='break' ? `<div class="hero-actions">
        <button class="btn btn-ghost" data-act="notdone" data-id="${current.id}">No lo hice</button>
        <button class="btn btn-coral" data-act="done" data-id="${current.id}">Hecho ✓</button>
      </div>` : ''}
    `;
    heroNow.querySelectorAll('[data-act]').forEach(b=>{
      b.addEventListener('click', ()=> b.dataset.act==='done' ? markDone(b.dataset.id) : askNotDone(b.dataset.id));
    });
  } else {
    heroNow.innerHTML = `<div class="eyebrow">AHORA</div><div class="hero-empty">Tienes un rato libre 🌿 Aprovecha para descansar o adelantar algo.</div>`;
  }
  const heroNext = $('hero-next');
  if(next){
    heroNext.className='next-card';
    const t = tasks.find(x=>x.id===next.taskId);
    heroNext.innerHTML = `<div class="lbl">Después</div><div class="info"><div class="n">${t?catEmoji(t):'☕'} ${escapeHtml(next.name)} — ${next.end-next.start} min</div><div class="t mono">${toHHMM(next.start)} — ${toHHMM(next.end)}</div></div>`;
  } else {
    heroNext.className='next-card empty';
    heroNext.innerHTML = `<div class="lbl">Después</div><div class="info">Nada más por ahora</div>`;
  }
}
function renderInicioList(){
  const wrap = $('inicio-day-list');
  const sorted = [...schedule].sort((a,b)=>a.start-b.start);
  $('inicio-day-count').textContent = sorted.length ? `${sorted.length} bloques` : '';
  if(!sorted.length){ wrap.innerHTML = `<div class="empty-state"><span class="ee">🗓️</span>Cuando generes tu plan, aquí verás el día completo de un vistazo.</div>`; return; }
  wrap.innerHTML='';
  const card = document.createElement('div'); card.className='task-card'; card.style.padding='4px 16px';
  sorted.forEach(b=>{
    const t = tasks.find(x=>x.id===b.taskId);
    let cls='day-item';
    if(b.status==='hecho') cls+=' done';
    if(b.status==='no_realizado') cls+=' missed';
    if(b.type==='break') cls+=' break-item';
    const div = document.createElement('div'); div.className=cls;
    div.innerHTML = `<div class="time mono">${toHHMM(b.start)}</div><div class="emoji">${b.type==='break'?'☕':(t?catEmoji(t):'✅')}</div><div class="txt"><div class="n">${escapeHtml(b.name)}</div></div>`;
    card.appendChild(div);
  });
  wrap.appendChild(card);
}
function renderDiaFull(){
  const wrap = $('dia-full-list');
  const sorted = [...schedule].sort((a,b)=>a.start-b.start);
  if(!sorted.length){ wrap.innerHTML = `<div class="empty-state"><span class="ee">📅</span>Todavía no hay nada planificado. Añade tareas y pulsa «Organízame» desde Inicio.</div>`; return; }
  const now = nowMinutes();
  wrap.innerHTML='';
  sorted.forEach(b=>{
    if(b.type==='break'){
      const div = document.createElement('div'); div.className='day-item break-item'; div.style.padding='6px 4px';
      div.innerHTML = `<div class="time mono">${toHHMM(b.start)}</div><div class="emoji">☕</div><div class="txt"><div class="n">Descanso · ${b.end-b.start} min</div></div>`;
      wrap.appendChild(div); return;
    }
    const div = document.createElement('div');
    let cls='task-card';
    if(b.status==='hecho') cls+=' done';
    if(now>=b.start && now<b.end && b.status==='pendiente') cls+=' now-active';
    div.className = cls;
    const task = tasks.find(t=>t.id===b.taskId);
    const prio = task ? task.priority : 'normal';
    const cat = task ? CATEGORIES[task.category]||CATEGORIES.otros : CATEGORIES.otros;
    const typeLabel = b.type==='fixed' ? 'Hora fija' : 'Flexible';
    const statusLabel = b.status==='hecho' ? ' · hecho ✓' : (b.status==='no_realizado' ? ' · no realizado' : '');
    div.innerHTML = `
      <div class="top"><span class="emoji">${cat.emoji}</span><span class="n">${escapeHtml(b.name)}</span></div>
      <div class="meta">
        <span>${toHHMM(b.start)} — ${toHHMM(b.end)} · ${b.end-b.start} min · ${typeLabel}${statusLabel}</span>
      </div>
      <div class="meta">
        <span class="pill-priority ${prio}">${PRIORITY[prio].emoji} ${PRIORITY[prio].label}</span>
        <span class="pill-cat">${cat.label}</span>
        ${task && task.deadlineLabel ? `<span class="pill-deadline">📅 ${task.deadlineLabel}</span>` : ''}
      </div>
      ${b.status==='pendiente' ? `<div class="actions">
        <button class="btn btn-ghost btn-sm" data-act="notdone" data-id="${b.id}">No realizado</button>
        <button class="btn btn-coral btn-sm" data-act="done" data-id="${b.id}">Hecho ✓</button>
      </div>` : ''}
    `;
    if(b.status==='pendiente'){
      div.querySelectorAll('[data-act]').forEach(btn=>{
        btn.addEventListener('click', ()=> btn.dataset.act==='done' ? markDone(btn.dataset.id) : askNotDone(btn.dataset.id));
      });
    }
    wrap.appendChild(div);
  });
}
function renderTareas(){
  const wrap = $('tareas-list');
  const pend = tasks.filter(t=>t.status==='pendiente'||t.status==='programada');
  $('tareas-count').textContent = pend.length ? `${pend.length}` : '';
  if(!pend.length){ wrap.innerHTML = `<div class="empty-state"><span class="ee">✅</span>No tienes tareas sueltas. Todo lo que añadas aparecerá aquí antes de organizarse en tu día.</div>`; }
  else{
    wrap.innerHTML='';
    pend.forEach(t=>{
      const div = document.createElement('div'); div.className='pending-card';
      div.innerHTML = `
        <div class="row1">
          <span>${catEmoji(t)}</span>
          <input type="text" value="${escapeHtml(t.name)}" data-field="name">
          <button class="rm" title="Eliminar">✕</button>
        </div>
        <div class="row2">
          <input type="number" value="${t.duration}" min="5" step="5" style="width:64px" data-field="duration" title="minutos"> min
          <select data-field="priority">
            ${Object.keys(PRIORITY).map(k=>`<option value="${k}" ${t.priority===k?'selected':''}>${PRIORITY[k].emoji} ${PRIORITY[k].label}</option>`).join('')}
          </select>
          <select data-field="category">
            ${Object.keys(CATEGORIES).map(k=>`<option value="${k}" ${t.category===k?'selected':''}>${CATEGORIES[k].emoji} ${CATEGORIES[k].label}</option>`).join('')}
          </select>
          ${t.fixedTime ? `<span class="fixed-tag">🕓 ${t.fixedTime}</span>` : `<input type="date" data-field="deadline" value="${t.deadline||''}" title="fecha límite">`}
          ${t.recurringRuleId ? `<span class="recur-tag">🔁 repite</span>` : ''}
        </div>
      `;
      div.querySelectorAll('[data-field]').forEach(el=>{
        el.addEventListener('change', ()=>{
          const f = el.dataset.field;
          t[f] = f==='duration' ? parseInt(el.value||30,10) : el.value;
          saveState();
        });
      });
      div.querySelector('.rm').addEventListener('click', ()=>removePendingTask(t.id));
      wrap.appendChild(div);
    });
  }
  const postponedWrap = $('postponed-wrap');
  const postponed = tasks.filter(t=>t.status==='pospuesta');
  if(!postponed.length){ postponedWrap.innerHTML=''; return; }
  postponedWrap.innerHTML = `<div class="sec-title postponed-block">Pospuestas</div>` + postponed.map(t=>`
    <div class="postponed-item"><span>${catEmoji(t)}</span><span class="n">${escapeHtml(t.name)}</span><button data-id="${t.id}">Reactivar hoy</button></div>
  `).join('');
  postponedWrap.querySelectorAll('button[data-id]').forEach(btn=>btn.addEventListener('click', ()=>reactivateTask(btn.dataset.id)));
}
function renderProgreso(){
  const todays = schedule.filter(b=>b.type!=='break');
  const total = todays.length, done = todays.filter(b=>b.status==='hecho').length;
  $('prog-fraction').textContent = `${done}/${total}`;
  $('prog-bar').style.width = total ? `${Math.round(done/total*100)}%` : '0%';
  const note = $('prog-note');
  if(total===0) note.textContent = 'Cuando generes tu plan del día, aquí verás cómo va avanzando.';
  else if(done===total) note.textContent = '¡Has completado todo lo de hoy! 🎉';
  else note.textContent = `Vas ${done} de ${total}. Cada tarea cuenta, a tu ritmo.`;
}
function renderAll(){ renderStatusPill(); renderHero(); renderInicioList(); renderDiaFull(); renderTareas(); renderProgreso(); }

// ---------------- CLOCK ----------------
function updateClock(){
  const d = new Date();
  $('clock').textContent = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const h = d.getHours();
  $('greet').textContent = h<12 ? 'Buenos días 👋' : (h<20 ? 'Buenas tardes 👋' : 'Buenas noches 👋');
  $('date-label').textContent = d.toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'});
  const ti = todayIso();
  if(settings.lastDate !== ti){ instantiateRecurring(ti); settings.lastDate = ti; saveState(); }
  renderStatusPill(); renderHero(); renderInicioList(); renderDiaFull();
}

        <span>${CATEGORIES[d.category].label}</span>
        <span>${d.duration} min${d.durationKnown?'':' (estimado)'}</span>
        ${d.fixedTime ? `<span>🕓 hora fija ${d.fixedTime}</span>` : ''}
        ${d.deadlineLabel ? `<span>📅 ${d.deadlineLabel}</span>` : ''}
        ${d.recurringDays ? `<span>🔁 ${d.recurringDays.map(x=>WEEKDAYS[x]).join(', ')}</span>` : ''}
      </div>
      ${(!d.fixedTime && d.duration>=120) ? `<label class="split-toggle"><input type="checkbox" data-split="${i}" ${d.split?'checked':''}> Dividir en 3 pasos (preparar / hacer / revisar)</label>` : ''}
    </div>
  `).join('');
  pv.querySelectorAll('[data-split]').forEach(cb=>{
    cb.addEventListener('change', ()=>{ currentDrafts[cb.dataset.split].split = cb.checked; });
  });
}
$('btn-fab').addEventListener('click', ()=>{ $('modal').classList.add('open'); $('inbox').focus(); });
$('btn-modal-close').addEventListener('click', ()=>{ $('modal').classList.remove('open'); $('inbox').value=''; currentDrafts=[]; $('preview-list').innerHTML=''; });
$('inbox').addEventListener('input', ()=>{ currentDrafts = parseToDrafts($('inbox').value); renderPreview(); });
$('btn-modal-add').addEventListener('click', ()=>{
  currentDrafts.forEach(d=>{
    if(d.recurringDays){
      const rule = { id:'r'+Date.now()+Math.random().toString(36).slice(2,6), name:d.name, category:d.category, duration:d.duration, priority:d.priority, fixedTime:d.fixedTime, days:d.recurringDays, lastInstanceDate:'' };
      recurringRules.push(rule);
      if(d.recurringDays.includes(new Date().getDay())){ instantiateRecurring(todayIso()); }
      return;
    }
    if(d.split && !d.fixedTime && d.duration>=120){
      const groupId = 'g'+Date.now()+Math.random().toString(36).slice(2,6);
      splitDraft(d).forEach(sub=>{
        tasks.push({ id:'t'+Date.now()+Math.random().toString(36).slice(2,6), name:sub.name, category:d.category, duration:sub.duration, durationKnown:d.durationKnown, priority:d.priority, deadline:d.deadline, deadlineLabel:d.deadlineLabel, fixedTime:null, status:'pendiente', groupId });
      });
      return;
    }
    tasks.push({ id:'t'+Date.now()+Math.random().toString(36).slice(2,6), name:d.name, category:d.category, duration:d.duration, durationKnown:d.durationKnown, priority:d.priority, deadline:d.deadline, deadlineLabel:d.deadlineLabel, fixedTime:d.fixedTime, status:'pendiente' });
  });
  saveState(); renderAll();
  $('inbox').value=''; currentDrafts=[]; $('preview-list').innerHTML='';
  $('modal').classList.remove('open');
});

$('confirm-yes').addEventListener('click', ()=>resolveNotDone(true));
$('confirm-no').addEventListener('click', ()=>resolveNotDone(false));

$('btn-organize').addEventListener('click', ()=>buildSchedule(nowMinutes()));
$('btn-save-settings').addEventListener('click', ()=>{
  settings.wake = $('set-wake').value;
  settings.sleep = $('set-sleep').value;
  settings.breakMin = parseInt($('set-break').value||10,10);
  settings.workBlock = parseInt($('set-workblock').value||90,10);
  saveState();
});

loadState();
setInterval(updateClock, 30000);
updateClock();
</script>
</body>
</html>
