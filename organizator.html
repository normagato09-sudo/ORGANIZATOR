/* ==================================================================
   VISTA HORARIO (app de exámenes)
   Tabla fija de lunes a viernes de 8:00 a 14:30 en franjas de 30 minutos.
   Tocar una franja vacía abre la ventana para añadir una clase ese día a
   esa hora. Salen las clases (bloques de "Horarios bloqueados" con
   subjectId, con el color de su asignatura) y los bloques sin asignatura
   creados desde aquí (inHorario: true, p. ej. el recreo). Los demás
   bloques de rutina (gimnasio, trabajo…) no salen aquí. Todo sigue en
   customSchedules, así que cuenta como tiempo ocupado.
   ================================================================== */
const HORARIO_DAYS = 5;                  // lunes a viernes (índices 0..4 de DOW_SHORT)
const HORARIO_START_MIN = 8 * 60;        // 08:00
const HORARIO_END_MIN = 14 * 60 + 30;    // 14:30
const HORARIO_SLOT_MIN = 30;             // cada fila de la tabla
const HORARIO_SLOT_PX = 46;              // alto de cada fila (media hora)

function hhmmToMin(t){
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || ''));
  return m ? Number(m[1]) * 60 + Number(m[2]) : null;
}
function minToHHMM(min){
  return `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;
}
/** Inicio de cada fila de la tabla en minutos: 480, 510, … 840. */
function horarioSlots(){
  const out = [];
  for(let m = HORARIO_START_MIN; m < HORARIO_END_MIN; m += HORARIO_SLOT_MIN) out.push(m);
  return out;
}
/** Horas que propone la ventana al tocar una franja: empieza en la franja
 * y dura una hora, sin pasar de las 14:30. */
function horarioSlotPrefill(day, startMin){
  return { days: [day], startTime: minToHHMM(startMin), endTime: minToHHMM(Math.min(startMin + 60, HORARIO_END_MIN)) };
}
/** Bloques de la tabla por día: { days: [[{ id, name, color|null, isClass,
 * startTime, endTime, top, height, lane, lanes }]] } con top/height en
 * minutos desde las 8:00 (recortados a 8:00–14:30). Lo que se solapa el
 * mismo día va en carriles (lane de 0 a lanes-1) para que se vea todo. */
function horarioLayout(schedules, subjects){
  const byId = new Map((subjects || []).map(s => [s.id, s]));
  const days = Array.from({ length: HORARIO_DAYS }, () => []);
  (schedules || []).forEach(s => {
    if(!s) return;
    const subject = s.subjectId ? byId.get(s.subjectId) : null;
    if(!subject && !s.inHorario) return;
    const start = hhmmToMin(s.startTime), end = hhmmToMin(s.endTime);
    if(start === null || end === null || end <= start) return;
    const from = Math.max(start, HORARIO_START_MIN), to = Math.min(end, HORARIO_END_MIN);
    if(to <= from) return;
    (Array.isArray(s.days) ? s.days : []).forEach(d => {
      if(!(d >= 0 && d < HORARIO_DAYS)) return;
      days[d].push({ id: s.id, name: subject ? subject.name : (s.name || ''), color: subject ? subject.color : null,
        isClass: !!subject, startTime: s.startTime, endTime: s.endTime, start: from, end: to });
    });
  });
  const laidOut = days.map(items => {
    items.sort((a,b) => a.start - b.start || a.end - b.end);
    // Grupos de bloques que se solapan; dentro de cada grupo, carriles.
    const out = [];
    let group = [], groupEnd = -Infinity;
    const flush = () => {
      const laneEnds = [];
      group.forEach(it => {
        let lane = laneEnds.findIndex(e => e <= it.start);
        if(lane === -1){ lane = laneEnds.length; laneEnds.push(0); }
        laneEnds[lane] = it.end;
        it.lane = lane;
      });
      group.forEach(it => { it.lanes = laneEnds.length; });
      out.push(...group);
      group = []; groupEnd = -Infinity;
    };
    items.forEach(it => {
      if(group.length && it.start >= groupEnd) flush();
      group.push(it);
      groupEnd = Math.max(groupEnd, it.end);
    });
    if(group.length) flush();
    return out.map(({ start, end, ...it }) => ({ ...it, top: start - HORARIO_START_MIN, height: end - start }));
  });
  return { days: laidOut };
}

/** Día que se ve en el móvil en vertical (un día cada vez): empieza en hoy
 * (lunes si hoy es fin de semana) y se cambia con las pestañas L M X J V. */
let horarioSelectedDay = null;
function horarioDefaultDay(today){
  return today >= 0 && today < HORARIO_DAYS ? today : 0;
}

function renderHorario(){
  const el = document.getElementById('view-horario');
  if(!el) return;
  const layout = horarioLayout(state.customSchedules, state.subjects);
  const slots = horarioSlots();
  const heightPx = slots.length * HORARIO_SLOT_PX;
  const px = (min) => (min / HORARIO_SLOT_MIN * HORARIO_SLOT_PX).toFixed(1);
  const today = dowOfDate(todayStr());
  if(horarioSelectedDay === null) horarioSelectedDay = horarioDefaultDay(today);
  const dayClass = (i) => `${i === today ? ' today' : ''}${i === horarioSelectedDay ? ' is-selected' : ''}`;
  const tabs = DOW_FULL_MONFIRST.slice(0, HORARIO_DAYS)
    .map((name,i) => `<button type="button" class="horario-tab${dayClass(i)}" data-horario-tab="${i}" aria-label="${name}" aria-pressed="${i === horarioSelectedDay}">${DOW_SHORT[i]}</button>`).join('');
  const headCells = DOW_FULL_MONFIRST.slice(0, HORARIO_DAYS)
    .map((name,i) => `<div class="horario-day-name${dayClass(i)}" data-horario-day="${i}"><span class="horario-day-short">${DOW_SHORT[i]}</span><span class="horario-day-full">${name}</span></div>`).join('');
  const isHour = (m) => m % 60 === 0;
  const timeLabels = slots.map(m => `<div class="horario-hour${isHour(m) ? ' is-hour' : ''}" style="top:${px(m - HORARIO_START_MIN)}px;">${minToHHMM(m)}</div>`).join('');
  const cols = layout.days.map((items, d) => `
    <div class="horario-col${dayClass(d)}" data-horario-day="${d}" style="height:${heightPx}px;">
      ${slots.map(m => `<button type="button" class="horario-slot${isHour(m) ? ' is-hour' : ''}" data-horario-slot="${d}|${m}" style="top:${px(m - HORARIO_START_MIN)}px;height:${HORARIO_SLOT_PX}px;" aria-label="Añadir clase el ${DOW_FULL_MONFIRST[d]} a las ${minToHHMM(m)}"></button>`).join('')}
      ${items.map(it => {
        const width = 100 / it.lanes;
        const colors = it.isClass
          ? `background:${esc(it.color)};border-left-color:${esc(it.color)};color:${textColorOn(it.color)};`
          : 'background:var(--paper);border-left-color:var(--ink-soft);';
        return `<button type="button" class="horario-class${it.isClass ? '' : ' horario-break'}" data-horario-class="${esc(it.id)}"
          style="top:${px(it.top)}px;height:${px(it.height)}px;left:calc(${(it.lane * width).toFixed(2)}% + 2px);width:calc(${width.toFixed(2)}% - 4px);${colors}"
          title="${esc(it.name)} · ${esc(it.startTime)}–${esc(it.endTime)}">
          <span class="horario-class-name">${esc(it.name)}</span>
          <span class="horario-class-time">${esc(it.startTime)}–${esc(it.endTime)}</span>
        </button>`;
      }).join('')}
    </div>`).join('');
  const noSubjects = !state.subjects.length
    ? `<div class="empty-state" style="margin-bottom:16px;">Para poner clases, primero añade tus asignaturas en Ajustes › Asignaturas. Mientras tanto puedes apuntar bloques sin asignatura, como el recreo.</div>`
    : '';
  el.innerHTML = `
    <div class="area-head">
      <div class="area-head-l">
        <div class="ic" style="background:var(--paper);color:var(--ink);">🕘</div>
        <div><h1>Horario</h1><p>Tus clases de lunes a viernes</p></div>
      </div>
    </div>
    ${noSubjects}
    <section class="block">
      <div class="horario-tabs" role="group" aria-label="Día">${tabs}</div>
      <div class="horario-wrap">
        <div class="horario-grid">
          <div></div>${headCells}
          <div class="horario-hours" style="height:${heightPx}px;">${timeLabels}</div>${cols}
        </div>
      </div>
      <p class="horario-hint">Toca un hueco para añadir una clase o un recreo; toca una clase para cambiarla o borrarla.</p>
    </section>`;
  el.querySelectorAll('[data-horario-tab]').forEach(tab => {
    tab.addEventListener('click', () => {
      horarioSelectedDay = Number(tab.dataset.horarioTab);
      el.querySelectorAll('[data-horario-tab]').forEach(t => {
        const on = Number(t.dataset.horarioTab) === horarioSelectedDay;
        t.classList.toggle('is-selected', on);
        t.setAttribute('aria-pressed', String(on));
      });
      el.querySelectorAll('.horario-col[data-horario-day], .horario-day-name[data-horario-day]').forEach(c => {
        c.classList.toggle('is-selected', Number(c.dataset.horarioDay) === horarioSelectedDay);
      });
    });
  });
  el.querySelectorAll('[data-horario-slot]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [d, m] = btn.dataset.horarioSlot.split('|').map(Number);
      openScheduleModal({ fromHorario: true, prefill: horarioSlotPrefill(d, m) });
    });
  });
  el.querySelectorAll('[data-horario-class]').forEach(btn => {
    btn.addEventListener('click', () => openScheduleModal({ scheduleId: btn.dataset.horarioClass, fromHorario: true }));
  });
}

/* ==================================================================
   MODAL: HORARIO BLOQUEADO
   Desde Ajustes (bloques de rutina) y desde la vista Horario
   (fromHorario: clases y bloques sin asignatura como el recreo; prefill
   trae el día y las horas de la franja tocada).
   ================================================================== */
function openScheduleModal({scheduleId=null, subjectId=null, prefill=null, fromHorario=false}={}){
  const editing = !!scheduleId;
  const existing = editing ? state.customSchedules.find(s=>s.id===scheduleId) : null;
  const base = existing || prefill || {};
  const selectedDays = Array.isArray(base.days) ? base.days : [];
  // Asignatura opcional (el bloque pasa a ser una clase).
  const linked = existing ? scheduleSubject(existing) : state.subjects.find(s => s.id === subjectId) || null;
  const subjectOptions = [...state.subjects].sort((a,b) => (a.name||'').localeCompare(b.name||'', 'es'))
    .map(s => `<option value="${esc(s.id)}" ${linked && linked.id === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
  // En Horario, una franja nueva obliga a elegir: una asignatura o "sin asignatura".
  const askSubject = fromHorario && !existing && !linked;
  const noneOption = fromHorario
    ? `<option value="none" ${existing && !linked ? 'selected' : ''}>Sin asignatura (recreo, tutoría…)</option>`
    : `<option value="">Ninguna</option>`;
  const subjectField = state.subjects.length ? `
      <div class="form-group"><label for="schedule-subject">${fromHorario ? 'Asignatura' : 'Asignatura (si es una clase)'}</label>
        <select id="schedule-subject" name="subjectId" ${askSubject ? 'required' : ''}>
          ${askSubject ? '<option value="" disabled selected>Elige una asignatura…</option>' : ''}${fromHorario ? '' : noneOption}${subjectOptions}${fromHorario ? noneOption : ''}
        </select>
      </div>` : '';
  const hideName = !!linked || askSubject;
  const namePlaceholder = fromHorario ? 'Ej. Recreo, Tutoría…' : 'Ej. Escuela, Trabajo, Gimnasio…';
  const title = linked || askSubject ? 'clase' : (fromHorario ? 'bloque' : 'bloque de horario');

  modalBox.innerHTML = `
    <h3>${editing?'Editar':'Añadir'} ${title}</h3>
    <form id="schedule-form">
      ${subjectField}
      <div class="form-group" id="schedule-name-group" ${hideName?'style="display:none;"':''}><label>Nombre</label>
        <input type="text" name="name" ${hideName?'':'required'} value="${existing?esc(existing.name):''}" placeholder="${namePlaceholder}">
      </div>
      <div class="form-group"><label>Días</label>
        <div class="day-pills" id="schedule-day-pills">
          ${DOW_SHORT.map((lb,i)=>`<button type="button" class="day-pill ${selectedDays.includes(i)?'on':''}" data-day="${i}">${lb}</button>`).join('')}
        </div>
      </div>
      <div class="form-row-2">
        <div class="form-group"><label>Hora inicio</label>
          <input type="time" name="startTime" required value="${esc(base.startTime||'')}">
        </div>
        <div class="form-group"><label>Hora fin</label>
          <input type="time" name="endTime" required value="${esc(base.endTime||'')}">
        </div>
      </div>
      <div class="form-error" id="schedule-error"></div>
      <div class="modal-actions">
        <div>${editing?`<button type="button" class="btn" id="schedule-delete-btn">Eliminar</button>`:''}</div>
        <div class="right">
          <button type="button" class="btn" id="schedule-cancel-btn">Cancelar</button>
          <button type="submit" class="btn btn-dark">Guardar</button>
        </div>
      </div>
    </form>`;

  let days = [...selectedDays];
  modalBox.querySelectorAll('#schedule-day-pills .day-pill').forEach(pill=>{
    pill.addEventListener('click', ()=>{
      const d = Number(pill.dataset.day);
      if(days.includes(d)){ days = days.filter(x=>x!==d); pill.classList.remove('on'); }
      else { days.push(d); pill.classList.add('on'); }
    });
  });

  const subjectSelect = modalBox.querySelector('#schedule-subject');
  if(subjectSelect){
    subjectSelect.addEventListener('change', ()=>{
      const isClass = state.subjects.some(s => s.id === subjectSelect.value);
      modalBox.querySelector('#schedule-name-group').style.display = isClass ? 'none' : '';
      modalBox.querySelector('input[name="name"]').required = !isClass;
      modalBox.querySelector('h3').textContent = `${editing?'Editar':'Añadir'} ${isClass ? 'clase' : (fromHorario ? 'bloque' : 'bloque de horario')}`;
    });
  }

  modalBox.querySelector('#schedule-cancel-btn').addEventListener('click', closeModal);
  if(editing){
    modalBox.querySelector('#schedule-delete-btn').addEventListener('click', async ()=>{
      if(confirm(linked ? '¿Eliminar esta clase?' : '¿Eliminar este bloque de horario?')){ await deleteCustomSchedule(scheduleId); closeModal(); renderCurrentView(); }
    });
  }
  modalBox.querySelector('#schedule-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const subject = state.subjects.find(s => s.id === fd.get('subjectId')) || null;
    const data = {
      name: subject ? subject.name : (fd.get('name') || '').trim(),
      days: [...days].sort((a,b)=>a-b),
      startTime: fd.get('startTime'),
      endTime: fd.get('endTime'),
      subjectId: subject ? subject.id : null,
      inHorario: fromHorario || !!(existing && existing.inHorario),
    };
    const errorEl = modalBox.querySelector('#schedule-error');
    if(!data.days.length){ errorEl.textContent = 'Elige al menos un día.'; return; }
    if(!data.name || !data.startTime || !data.endTime) return;
    if(data.endTime <= data.startTime){ errorEl.textContent = 'La hora de fin tiene que ser después de la de inicio.'; return; }
    if(editing) await updateCustomSchedule(scheduleId, data); else await addCustomSchedule(data);
    closeModal();
    showToast(editing?'Guardado':'Añadido');
    renderCurrentView();
  });

  overlay.classList.add('open');
}

/* ==================================================================
   ASIGNATURAS (app de exámenes, paso 2)
   Crear, editar y borrar asignaturas desde Ajustes. Modelo: ver STUDY_KEYS.
   - El nombre es obligatorio y no se repite (sin distinguir mayúsculas).
   - El color se elige de SUBJECT_COLORS o con "Otro color" (cualquier
     #RRGGBB). Un color ya usado por otra asignatura solo se avisa: se
     puede guardar igual. No hay límite de asignaturas.
   - passGrade (nota mínima de aprobado) admite decimales con coma o
     punto, de 0 a 10; por defecto DEFAULT_PASS_GRADE.
   - Una asignatura con exámenes no se puede borrar.
   ================================================================== */
/** Nota con coma decimal para mostrarla: 5 -> "5", 4.5 -> "4,5". */
function formatGrade(n){
  return String(n).replace('.', ',');
}
function findSubjectByName(name, excludeId){
  const key = String(name || '').trim().toLocaleLowerCase('es');
  return state.subjects.find(s => s.id !== excludeId && String(s.name || '').trim().toLocaleLowerCase('es') === key) || null;
}
/** Asignatura (distinta de excludeId) que ya usa ese color, o null. */
function findSubjectByColor(color, excludeId){
  const key = String(color || '').toUpperCase();
  return state.subjects.find(s => s.id !== excludeId && String(s.color || '').toUpperCase() === key) || null;
}
function countExamsForSubject(subjectId){
  return state.exams.filter(e => e && e.subjectId === subjectId).length;
}
/** Bloques de "Horarios bloqueados" que son clases de la asignatura (paso 2b). */
function countClassesForSubject(subjectId){
  return state.customSchedules.filter(s => s && s.subjectId === subjectId).length;
}
/** Primer color de la paleta que no usa ninguna asignatura (o el primero). */
function nextFreeSubjectColor(){
  const free = SUBJECT_COLORS.find(c => !findSubjectByColor(c.color));
  return (free || SUBJECT_COLORS[0]).color;
}
/** Valida los datos de una asignatura. Devuelve { ok, value, errors }:
 * value = { name, color, passGrade } ya normalizado; errors = { name?,
 * color?, passGrade? } con el mensaje para el formulario. */
function validateSubjectData(data, excludeId){
  const errors = {};
  const name = String((data && data.name) || '').trim();
  if(!name) errors.name = 'Escribe un nombre.';
  else if(findSubjectByName(name, excludeId)) errors.name = 'Ya tienes una asignatura con ese nombre.';
  const color = String((data && data.color) || '').toUpperCase();
  if(!HEX_COLOR_RE.test(color)) errors.color = 'Elige un color.';
  const rawGrade = data && data.passGrade;
  const passGrade = (rawGrade === undefined || rawGrade === null || rawGrade === '') ? DEFAULT_PASS_GRADE : parsePassGrade(rawGrade);
  if(passGrade === null) errors.passGrade = 'La nota de aprobado debe estar entre 0 y 10 (por ejemplo 5 o 4,5).';
  // "Lleva nota": sí salvo que llegue false expresamente.
  const graded = !(data && data.graded === false);
  return { ok: Object.keys(errors).length === 0, value: { name, color, passGrade, graded }, errors };
}
/** Crea una asignatura. { ok: true, subject } o { ok: false, errors }. */
async function addSubject(data){
  const check = validateSubjectData(data, null);
  if(!check.ok) return { ok: false, errors: check.errors };
  const now = Date.now();
  const subject = { id: uid(), ...check.value, createdAt: now, updatedAt: now };
  state.subjects.push(subject);
  await saveSubjects();
  return { ok: true, subject };
}
/** Edita una asignatura. { ok: true, subject } o { ok: false, errors }. */
async function updateSubject(id, data){
  const subject = state.subjects.find(s => s.id === id);
  if(!subject) return { ok: false, errors: { name: 'Esta asignatura ya no existe.' } };
  const check = validateSubjectData(data, id);
  if(!check.ok) return { ok: false, errors: check.errors };
  Object.assign(subject, check.value, { updatedAt: Date.now() });
  await saveSubjects();
  // Paso 2b: sus clases llevan el nombre de la asignatura.
  const classes = state.customSchedules.filter(s => s && s.subjectId === id && s.name !== subject.name);
  if(classes.length){
    classes.forEach(s => { s.name = subject.name; });
    await saveCustomSchedules();
  }
  return { ok: true, subject };
}
/** Borra una asignatura si no tiene exámenes ni clases. { ok: true } o
 * { ok: false, examCount, classCount } (o { ok: false, notFound: true }). */
async function deleteSubject(id){
  if(!state.subjects.some(s => s.id === id)) return { ok: false, notFound: true };
  const examCount = countExamsForSubject(id);
  const classCount = countClassesForSubject(id);
  if(examCount > 0 || classCount > 0) return { ok: false, examCount, classCount };
  state.subjects = state.subjects.filter(s => s.id !== id);
  await saveSubjects();
  return { ok: true };
}

function examCountLabel(n){
  return n === 1 ? '1 examen' : `${n} exámenes`;
}
function renderSubjectRows(){
  const sorted = [...state.subjects].sort((a,b) => (a.name||'').localeCompare(b.name||'', 'es'));
  const rows = sorted.map(s=>`
    <div class="schedule-row subject-row" data-subject-row="${esc(s.id)}">
      <div class="sched-main">
        <div class="sched-name"><span class="priority-dot subject-dot" style="background:${esc(s.color)};"></span>${esc(s.name)}</div>
        <div class="sched-meta">${s.graded === false ? 'No lleva nota' : `Aprobado con ${esc(formatGrade(s.passGrade ?? DEFAULT_PASS_GRADE))}`}</div>
      </div>
      <div class="subject-actions">
        <button type="button" class="btn btn-sm" data-subject-edit="${esc(s.id)}">Editar</button>
        <button type="button" class="btn btn-sm" data-subject-delete="${esc(s.id)}">Borrar</button>
      </div>
    </div>`).join('');
  const empty = sorted.length ? '' : `<div class="empty-state small" style="border:none;border-radius:0;">Todavía no tienes asignaturas. Añade las de este curso para poder apuntar sus exámenes.</div>`;
  return rows + empty + `<button type="button" class="add-schedule-btn" id="btn-add-subject">+ Añadir asignatura</button>`;
}

/** Pide confirmación y borra la asignatura; si tiene exámenes, avisa de
 * cuántos y no la borra. */
async function confirmDeleteSubject(id){
  const subject = state.subjects.find(s => s.id === id);
  if(!subject) return;
  const examCount = countExamsForSubject(id);
  if(examCount > 0){
    const fix = examCount === 1 ? 'Borra ese examen o cámbialo de asignatura primero.' : 'Borra esos exámenes o cámbialos de asignatura primero.';
    alert(`No se puede borrar "${subject.name}": tiene ${examCountLabel(examCount)}. ${fix}`);
    return;
  }
  const classCount = countClassesForSubject(id);
  if(classCount > 0){
    const what = classCount === 1 ? '1 clase en el horario' : `${classCount} clases en el horario`;
    alert(`No se puede borrar "${subject.name}": tiene ${what}. Bórralas o quítales la asignatura en Horario primero.`);
    return;
  }
  if(!confirm(`¿Borrar la asignatura "${subject.name}"?`)) return;
  const result = await deleteSubject(id);
  if(result.ok){ showToast('Asignatura borrada'); renderAjustes(); }
}

function openSubjectModal({subjectId=null}={}){
  const editing = !!subjectId;
  const existing = editing ? state.subjects.find(s=>s.id===subjectId) : null;
  if(editing && !existing) return;
  const existingColor = existing ? String(existing.color || '').toUpperCase() : '';
  const currentColor = HEX_COLOR_RE.test(existingColor) ? existingColor : nextFreeSubjectColor();
  // "Otro color": cualquier color con el selector del sistema.
  const isCustom = !SUBJECT_COLORS.some(c => c.color === currentColor);
  const swatches = SUBJECT_COLORS.map(c=>`
    <label class="color-swatch" title="${esc(c.name)}">
      <input type="radio" name="color" value="${c.color}" ${c.color===currentColor?'checked':''} aria-label="${esc(c.name)}">
      <span style="background:${c.color};"></span>
    </label>`).join('');

  modalBox.innerHTML = `
    <h3>${editing?'Editar':'Añadir'} asignatura</h3>
    <form id="subject-form" novalidate>
      <div class="form-group"><label for="subject-name">Nombre</label>
        <input type="text" id="subject-name" name="name" maxlength="60" value="${existing?esc(existing.name):''}" placeholder="Ej. Matemáticas, Historia…">
        <div class="form-error" data-error-for="name"></div>
      </div>
      <div class="form-group"><label>Color</label>
        <div class="color-swatches">${swatches}
          <label class="color-swatch color-swatch-custom" title="Otro color">
            <input type="radio" name="color" value="custom" ${isCustom?'checked':''} aria-label="Otro color">
            <span id="subject-custom-swatch" style="background:${isCustom ? currentColor : 'conic-gradient(#D64545,#A07800,#3A9149,#118A84,#3A7BD5,#8E57D1,#D14E8E,#D64545)'};"></span>
          </label>
        </div>
        <div class="color-custom-row">
          <label for="subject-custom-color">Otro color</label>
          <input type="color" id="subject-custom-color" value="${esc(currentColor.toLowerCase())}">
        </div>
        <div class="form-warning" id="subject-color-warning"></div>
        <div class="form-error" data-error-for="color"></div>
      </div>
      <div class="form-group"><label for="subject-pass-grade">Nota mínima de aprobado</label>
        <input type="text" id="subject-pass-grade" name="passGrade" inputmode="decimal" style="max-width:120px;" value="${esc(formatGrade(existing ? (existing.passGrade ?? DEFAULT_PASS_GRADE) : DEFAULT_PASS_GRADE))}">
        <div class="form-error" data-error-for="passGrade"></div>
      </div>
      <div class="form-group">
        <label class="checkbox-row"><input type="checkbox" id="subject-graded" name="graded" ${existing && existing.graded === false ? '' : 'checked'}> Lleva nota</label>
        <div class="row-sub" style="font-size:12px;color:var(--ink-soft);margin-top:4px;">Si no lleva nota, no sale en Notas y sus exámenes no piden nota. Sus notas guardadas no se borran.</div>
      </div>
      <div class="modal-actions">
        <div></div>
        <div class="right">
          <button type="button" class="btn" id="subject-cancel-btn">Cancelar</button>
          <button type="submit" class="btn btn-dark">Guardar</button>
        </div>
      </div>
    </form>`;

  const form = modalBox.querySelector('#subject-form');
  const customInput = form.querySelector('#subject-custom-color');
  const customRadio = form.querySelector('input[name="color"][value="custom"]');
  const customSwatch = modalBox.querySelector('#subject-custom-swatch');
  const pickedColor = ()=>{
    const picked = form.querySelector('input[name="color"]:checked');
    if(!picked) return '';
    return picked.value === 'custom' ? customInput.value.toUpperCase() : picked.value;
  };
  const showColorWarning = ()=>{
    const color = pickedColor();
    const other = color ? findSubjectByColor(color, subjectId) : null;
    modalBox.querySelector('#subject-color-warning').textContent = other ? `Este color ya lo usa "${other.name}". Puedes guardarlo igualmente.` : '';
  };
  form.querySelectorAll('input[name="color"]').forEach(r => r.addEventListener('change', showColorWarning));
  customInput.addEventListener('input', ()=>{
    customRadio.checked = true;
    customSwatch.style.background = customInput.value;
    showColorWarning();
  });
  customRadio.addEventListener('change', ()=>{ customSwatch.style.background = customInput.value; });
  showColorWarning();

  modalBox.querySelector('#subject-cancel-btn').addEventListener('click', closeModal);
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(form);
    const data = { name: fd.get('name') || '', color: pickedColor(), passGrade: (fd.get('passGrade') || '').trim(), graded: fd.get('graded') === 'on' };
    const result = editing ? await updateSubject(subjectId, data) : await addSubject(data);
    form.querySelectorAll('[data-error-for]').forEach(el => { el.textContent = (result.errors && result.errors[el.dataset.errorFor]) || ''; });
    if(!result.ok) return;
    closeModal();
    showToast(editing ? 'Asignatura guardada' : 'Asignatura añadida');
    renderAjustes();
  });

  overlay.classList.add('open');
  modalBox.querySelector('#subject-name').focus();
}

/* ==================================================================
   EXÁMENES Y ENTREGAS (app de exámenes)
   Se apuntan desde el Calendario: asignatura, tipo, título, fecha, hora
   opcional, trimestre (se rellena solo con la fecha, editable) y notas.
   El resto de campos del modelo (ver STUDY_KEYS) se quedan con su valor
   por defecto.
   ================================================================== */
const EXAM_TITLE_MAX = 120;
// Tipos que ofrece el formulario. Los demás de EXAM_TYPE_INFO (final,
// trabajo, exposición, deberes) siguen siendo válidos: un examen que ya
// tenga uno de ellos se ve y se edita igual (su tipo sale en la lista).
const EXAM_FORM_TYPES = ['examen', 'parcial', 'trimestral', 'recuperacion', 'ejercicios'];
const EXAM_NOTES_MAX = 1000;

/** Trimestre de una fecha YYYY-MM-DD: sep–dic = 1, ene–mar = 2, abr–jun = 3;
 * julio y agosto -> null (sin trimestre). */
function termForDate(dateStr){
  const m = /^\d{4}-(\d{2})-\d{2}$/.exec(String(dateStr || ''));
  if(!m) return null;
  const month = Number(m[1]);
  if(month >= 9 && month <= 12) return 1;
  if(month >= 1 && month <= 3) return 2;
  if(month >= 4 && month <= 6) return 3;
  return null;
}
function examTypeLabel(type){
  return Object.prototype.hasOwnProperty.call(EXAM_TYPE_INFO, type) ? EXAM_TYPE_INFO[type].label : 'Examen';
}
function examSubject(exam){
  return (exam && state.subjects.find(s => s.id === exam.subjectId)) || null;
}
/** Valida lo que llega del formulario. { ok, value, errors }. */
function validateExamData(data){
  const errors = {};
  const d = data || {};
  const subjectId = String(d.subjectId || '');
  if(!state.subjects.some(s => s.id === subjectId)) errors.subjectId = 'Elige una asignatura.';
  const type = String(d.type || '');
  if(!EXAM_TYPES.includes(type)) errors.type = 'Elige un tipo.';
  const title = String(d.title || '').trim();
  if(!title) errors.title = 'Escribe un título.';
  else if(title.length > EXAM_TITLE_MAX) errors.title = `Máximo ${EXAM_TITLE_MAX} caracteres.`;
  const date = String(d.date || '');
  if(!isValidYMDDate(date)) errors.date = 'Elige una fecha.';
  const rawTime = String(d.time || '').trim();
  const time = rawTime ? rawTime : null;
  if(time && !/^([01]\d|2[0-3]):[0-5]\d$/.test(time)) errors.time = 'Hora no válida.';
  const rawTerm = (d.term === '' || d.term === undefined || d.term === null) ? null : Number(d.term);
  const term = rawTerm === null ? null : (EXAM_TERMS.includes(rawTerm) ? rawTerm : undefined);
  if(term === undefined) errors.term = 'Elige el 1.º, 2.º o 3.er trimestre.';
  const notes = String(d.notes || '').trim();
  if(notes.length > EXAM_NOTES_MAX) errors.notes = `Máximo ${EXAM_NOTES_MAX} caracteres.`;
  const value = { subjectId, type, title, date, time, term: term === undefined ? null : term, notes };
  // La nota solo se toca si el formulario la trae (vacía = sin nota).
  if(Object.prototype.hasOwnProperty.call(d, 'grade')){
    const grade = parseGradeInput(d.grade);
    if(grade === undefined) errors.grade = 'La nota debe estar entre 0 y 10 (por ejemplo 7 o 6,5).';
    else value.grade = grade;
  }
  return { ok: Object.keys(errors).length === 0, value, errors };
}
/** Crea un examen o entrega. { ok: true, exam } o { ok: false, errors }. */
async function addExam(data){
  const check = validateExamData(data);
  if(!check.ok) return { ok: false, errors: check.errors };
  const v = check.value;
  const now = Date.now();
  const exam = {
    id: uid(), subjectId: v.subjectId, type: v.type, title: v.title, date: v.date, time: v.time,
    durationMinutes: null, term: v.term, weight: defaultExamWeight(v.type), topics: [], difficulty: 3,
    studyDaysBefore: null, deliveryStatus: isDeliveryType(v.type) ? 'pendiente' : null, recovers: null,
    grade: v.grade ?? null, notes: v.notes, createdAt: now, updatedAt: now,
  };
  state.exams.push(exam);
  await saveExams();
  return { ok: true, exam };
}
/** Edita un examen o entrega. { ok: true, exam } o { ok: false, errors }. */
async function updateExam(id, data){
  const exam = state.exams.find(e => e && e.id === id);
  if(!exam) return { ok: false, errors: { title: 'Este examen ya no existe.' } };
  const check = validateExamData(data);
  if(!check.ok) return { ok: false, errors: check.errors };
  const v = check.value;
  if(v.type !== exam.type){
    exam.weight = defaultExamWeight(v.type);
    exam.deliveryStatus = isDeliveryType(v.type) ? (exam.deliveryStatus || 'pendiente') : null;
  }
  Object.assign(exam, v, { updatedAt: Date.now() });
  await saveExams();
  return { ok: true, exam };
}
async function deleteExam(id){
  const before = state.exams.length;
  state.exams = state.exams.filter(e => !(e && e.id === id));
  if(state.exams.length !== before) await saveExams();
}
/** Exámenes y entregas de un día, por hora (los que no tienen hora, al final). */
function examsOnDate(dateStr){
  return state.exams.filter(e => e && e.date === dateStr)
    .sort((a,b) => (a.time || '99:99').localeCompare(b.time || '99:99') || String(a.title).localeCompare(String(b.title), 'es'));
}
function examRowHTML(exam){
  const subject = examSubject(exam);
  const color = subject ? subject.color : 'var(--ink-soft)';
  return `
    <div class="event-row exam-row" style="border-left:4px solid ${esc(color)};">
      <div class="row-body">
        <div class="row-top">
          <span class="priority-dot" style="background:${esc(color)};"></span>
          <span class="event-title">${esc(exam.title)}</span>
        </div>
        <div class="row-meta">
          <span>${esc(examTypeLabel(exam.type))} · ${esc(subject ? subject.name : 'Sin asignatura')}</span>
          <span>${exam.time ? esc(exam.time) : 'Sin hora'}</span>
          ${exam.term ? `<span>${exam.term}.º trimestre</span>` : ''}
        </div>
        ${exam.notes ? `<div class="row-notes">${esc(exam.notes)}</div>` : ''}
      </div>
      <div class="row-actions">
        <button class="btn-ghost" data-action="edit-exam" data-id="${esc(exam.id)}" title="Editar">✏️</button>
        <button class="btn-ghost" data-action="delete-exam" data-id="${esc(exam.id)}" title="Eliminar">🗑️</button>
      </div>
    </div>`;
}
async function confirmDeleteExam(id){
  const exam = state.exams.find(e => e && e.id === id);
  if(!exam) return;
  if(!confirm(`¿Borrar "${exam.title}"?`)) return;
  await deleteExam(id);
  showToast('Borrado');
  renderCurrentView();
}

function openExamModal({examId=null, date=null}={}){
  const editing = !!examId;
  const existing = editing ? state.exams.find(e => e && e.id === examId) : null;
  if(editing && !existing) return;
  if(!state.subjects.length){
    modalBox.innerHTML = `
      <h3>Añadir examen o entrega</h3>
      <p>Primero añade tus asignaturas en Ajustes › Asignaturas.</p>
      <div class="modal-actions"><div></div><div class="right">
        <button type="button" class="btn btn-dark" id="exam-close-btn">Entendido</button>
      </div></div>`;
    modalBox.querySelector('#exam-close-btn').addEventListener('click', closeModal);
    overlay.classList.add('open');
    return;
  }
  const startDate = existing ? existing.date : (date || todayStr());
  const startTerm = existing ? existing.term : termForDate(startDate);
  const subjectOptions = [...state.subjects].sort((a,b) => (a.name||'').localeCompare(b.name||'', 'es'))
    .map(s => `<option value="${esc(s.id)}" ${existing && existing.subjectId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
  const formTypes = EXAM_TYPES.filter(t => EXAM_FORM_TYPES.includes(t) || (existing && existing.type === t));
  const typeOptions = (group) => formTypes.filter(t => EXAM_TYPE_INFO[t].group === group)
    .map(t => `<option value="${t}" ${(existing ? existing.type : 'examen') === t ? 'selected' : ''}>${esc(EXAM_TYPE_INFO[t].label)}</option>`).join('');
  const termOptions = [1, 2, 3].map(t => `<option value="${t}" ${startTerm === t ? 'selected' : ''}>${t}.º trimestre</option>`).join('')
    + `<option value="" ${startTerm ? '' : 'selected'}>Sin trimestre</option>`;

  modalBox.innerHTML = `
    <h3>${editing ? 'Editar' : 'Añadir'} examen o entrega</h3>
    <form id="exam-form" novalidate>
      <div class="form-group"><label for="exam-subject">Asignatura</label>
        <select id="exam-subject" name="subjectId">
          ${existing ? '' : '<option value="" selected disabled>Elige una asignatura…</option>'}${subjectOptions}
        </select>
        <div class="form-error" data-error-for="subjectId"></div>
      </div>
      <div class="form-group"><label for="exam-type">Tipo</label>
        <select id="exam-type" name="type">
          <optgroup label="Pruebas">${typeOptions('prueba')}</optgroup>
          <optgroup label="Entregas">${typeOptions('entrega')}</optgroup>
        </select>
        <div class="form-error" data-error-for="type"></div>
      </div>
      <div class="form-group"><label for="exam-title">Título</label>
        <input type="text" id="exam-title" name="title" maxlength="${EXAM_TITLE_MAX}" value="${existing ? esc(existing.title) : ''}" placeholder="Ej. Tema 3, Trabajo de la célula…">
        <div class="form-error" data-error-for="title"></div>
      </div>
      <div class="form-row-2">
        <div class="form-group"><label for="exam-date">Fecha</label>
          <input type="date" id="exam-date" name="date" value="${esc(startDate)}">
          <div class="form-error" data-error-for="date"></div>
        </div>
        <div class="form-group"><label for="exam-time">Hora (opcional)</label>
          <input type="time" id="exam-time" name="time" value="${existing && existing.time ? esc(existing.time) : ''}">
          <div class="form-error" data-error-for="time"></div>
        </div>
      </div>
      <div class="form-row-2">
        <div class="form-group"><label for="exam-term">Trimestre</label>
          <select id="exam-term" name="term">${termOptions}</select>
          <div class="form-error" data-error-for="term"></div>
        </div>
        <div class="form-group" id="exam-grade-group"><label for="exam-grade">Nota (opcional)</label>
          <input type="text" id="exam-grade" name="grade" inputmode="decimal" maxlength="5" placeholder="—" value="${existing && typeof existing.grade === 'number' ? esc(formatGrade(existing.grade)) : ''}">
          <div class="form-error" data-error-for="grade"></div>
        </div>
      </div>
      <div class="form-group"><label for="exam-notes">Notas (opcional)</label>
        <textarea id="exam-notes" name="notes" rows="3" maxlength="${EXAM_NOTES_MAX}" placeholder="Temas que entran, material…">${existing ? esc(existing.notes || '') : ''}</textarea>
        <div class="form-error" data-error-for="notes"></div>
      </div>
      <div class="modal-actions">
        <div>${editing ? `<button type="button" class="btn btn-danger" id="exam-delete-btn">Eliminar</button>` : ''}</div>
        <div class="right">
          <button type="button" class="btn" id="exam-cancel-btn">Cancelar</button>
          <button type="submit" class="btn btn-dark">Guardar</button>
        </div>
      </div>
    </form>`;

  const form = modalBox.querySelector('#exam-form');
  const dateInput = form.querySelector('#exam-date');
  // "Lleva nota": sin nota, la casilla no sale (y al guardar no se toca la nota).
  const subjectSelect = form.querySelector('#exam-subject');
  const gradeGroup = form.querySelector('#exam-grade-group');
  const gradedSelected = () => isSubjectGraded(state.subjects.find(s => s.id === subjectSelect.value));
  const updateGradeField = () => { gradeGroup.hidden = !gradedSelected(); };
  subjectSelect.addEventListener('change', updateGradeField);
  updateGradeField();
  const termSelect = form.querySelector('#exam-term');
  // El trimestre sigue a la fecha hasta que el usuario lo cambia a mano.
  let termTouched = !!existing && existing.term !== termForDate(existing.date);
  termSelect.addEventListener('change', () => { termTouched = true; });
  dateInput.addEventListener('change', () => {
    if(termTouched) return;
    const t = termForDate(dateInput.value);
    termSelect.value = t ? String(t) : '';
  });

  modalBox.querySelector('#exam-cancel-btn').addEventListener('click', closeModal);
  if(editing){
    modalBox.querySelector('#exam-delete-btn').addEventListener('click', async () => {
      if(!confirm(`¿Borrar "${existing.title}"?`)) return;
      await deleteExam(examId);
      closeModal();
      showToast('Borrado');
      renderCurrentView();
    });
  }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const data = {
      subjectId: fd.get('subjectId') || '', type: fd.get('type') || '', title: fd.get('title') || '',
      date: fd.get('date') || '', time: fd.get('time') || '', term: fd.get('term') || '', notes: fd.get('notes') || '',
    };
    if(gradedSelected()) data.grade = fd.get('grade') || '';
    const result = editing ? await updateExam(examId, data) : await addExam(data);
    form.querySelectorAll('[data-error-for]').forEach(el => { el.textContent = (result.errors && result.errors[el.dataset.errorFor]) || ''; });
    if(!result.ok) return;
    closeModal();
    showToast(editing ? 'Guardado' : 'Añadido');
    if(currentView === 'calendario'){ cal.selected = result.exam.date; const d = parseYMD(result.exam.date); cal.year = d.getFullYear(); cal.month = d.getMonth(); }
    renderCurrentView();
  });

  overlay.classList.add('open');
}

/* ---------- Inicio: próximo examen o entrega y los siguientes ---------- */
const UPCOMING_LIST_MAX = 10;   // cuántos "siguientes" se listan debajo del próximo

/** Días enteros de `from` a `to` (YYYY-MM-DD), sin líos de horario de verano. */
function daysBetween(from, to){
  const [y1, m1, d1] = from.split('-').map(Number);
  const [y2, m2, d2] = to.split('-').map(Number);
  return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000);
}
function daysLeftLabel(n){
  if(n === 0) return 'Hoy';
  if(n === 1) return 'Mañana';
  return `En ${n} días`;
}
/** Exámenes y entregas de hoy en adelante, por fecha y hora (sin hora, al final del día). */
function upcomingExams(today){
  return state.exams.filter(e => e && typeof e.date === 'string' && e.date >= today)
    .sort((a,b) => a.date.localeCompare(b.date) || (a.time || '99:99').localeCompare(b.time || '99:99') || String(a.title).localeCompare(String(b.title), 'es'));
}
function examLongDate(exam){
  const d = parseYMD(exam.date);
  return `${DOW_NAMES[d.getDay()].toLowerCase()} ${d.getDate()} de ${MONTH_NAMES[d.getMonth()]}${exam.time ? ' · ' + exam.time : ''}`;
}
function renderUpcomingHTML(today){
  const list = upcomingExams(today);
  if(!list.length){
    return `<div class="empty-state">No tienes exámenes ni entregas a la vista.<br>Apúntalos en el <strong>Calendario</strong> con «+ Examen».</div>`;
  }
  const [next, ...rest] = list;
  const subjectOf = (e) => examSubject(e);
  const colorOf = (e) => { const s = subjectOf(e); return s ? s.color : '#63676C'; };
  const n = daysBetween(today, next.date);
  const nextSubject = subjectOf(next);
  const hero = `
    <button type="button" class="next-exam" data-upcoming-exam="${esc(next.id)}" style="border-left-color:${esc(colorOf(next))};">
      <div class="next-exam-count" style="background:${esc(colorOf(next))};color:${textColorOn(colorOf(next))};">
        ${n <= 1 ? `<span class="next-exam-word">${daysLeftLabel(n)}</span>` : `<span class="next-exam-num">${n}</span><span class="next-exam-unit">días</span>`}
      </div>
      <div class="next-exam-body">
        <div class="next-exam-kicker">${esc(examTypeLabel(next.type))} · ${esc(nextSubject ? nextSubject.name : 'Sin asignatura')}</div>
        <div class="next-exam-title">${esc(next.title)}</div>
        <div class="next-exam-date">${esc(examLongDate(next))}</div>
      </div>
    </button>`;
  const shown = rest.slice(0, UPCOMING_LIST_MAX);
  const more = rest.length - shown.length;
  const rows = shown.map(e => {
    const s = subjectOf(e);
    return `
      <button type="button" class="upcoming-row" data-upcoming-exam="${esc(e.id)}">
        <span class="priority-dot" style="background:${esc(colorOf(e))};"></span>
        <span class="upcoming-main">
          <span class="upcoming-title">${esc(e.title)}</span>
          <span class="upcoming-meta">${esc(examTypeLabel(e.type))} · ${esc(s ? s.name : 'Sin asignatura')} · ${esc(humanDateShort(e.date))}${e.time ? ' · ' + esc(e.time) : ''}</span>
        </span>
        <span class="upcoming-days" style="background:${esc(colorOf(e))};color:${textColorOn(colorOf(e))};">${daysLeftLabel(daysBetween(today, e.date))}</span>
      </button>`;
  }).join('');
  return hero + (shown.length ? `
    <div class="upcoming-head">Después</div>
    <div class="upcoming-list">${rows}</div>
    ${more > 0 ? `<p class="upcoming-more">Y ${more} más en el Calendario.</p>` : ''}` : '');
}
function renderUpcoming(){
  const el = document.getElementById('upcoming-exams');
  if(!el) return;
  el.innerHTML = renderUpcomingHTML(todayStr());
  el.querySelectorAll('[data-upcoming-exam]').forEach(btn => {
    btn.addEventListener('click', () => openExamModal({ examId: btn.dataset.upcomingExam }));
  });
}

/* ==================================================================
   NOTAS (app de exámenes)
   Por asignatura y trimestre: los exámenes y entregas con su nota
   (exam.grade, de 0 a 10) y la MEDIA del trimestre (media normal: todas
   las notas cuentan igual; las pruebas sin nota no cuentan). En cada
   trimestre, la nota final oficial se apunta a mano y se guarda dentro de
   la asignatura (subject.termFinals = { 1: nota|null, 2: …, 3: … }). Esa
   nota solo se guarda y se muestra: no entra en ninguna media y no hay
   nota del curso.
   ================================================================== */
/** Nota de 0 a 10 escrita por el usuario ("7,5", "7.5", 8…): número
 * redondeado a 2 decimales, null si está vacía, o undefined si no vale. */
function parseGradeInput(value){
  if(value === null || value === undefined) return null;
  if(typeof value === 'string' && value.trim() === '') return null;
  const n = parsePassGrade(value);
  return n === null ? undefined : n;
}
/** Media normal de las notas que hay (null si ninguna tiene nota). */
function termAverage(exams){
  const grades = (exams || []).map(e => e && e.grade).filter(g => typeof g === 'number' && Number.isFinite(g));
  if(!grades.length) return null;
  return Math.round(grades.reduce((a,b) => a + b, 0) / grades.length * 100) / 100;
}
/** Exámenes de una asignatura en un trimestre (term null = sin trimestre), por fecha. */
function subjectTermExams(subjectId, term){
  return state.exams.filter(e => e && e.subjectId === subjectId && (e.term ?? null) === term)
    .sort((a,b) => String(a.date).localeCompare(String(b.date)) || String(a.title).localeCompare(String(b.title), 'es'));
}
function termFinalOf(subject, term){
  const v = subject && subject.termFinals && subject.termFinals[term];
  return typeof v === 'number' && Number.isFinite(v) ? v : null;
}
/** Pone (o quita, con '') la nota de un examen. { ok, grade } o { ok: false, error }. */
async function setExamGrade(examId, raw){
  const exam = state.exams.find(e => e && e.id === examId);
  if(!exam) return { ok: false, error: 'Este examen ya no existe.' };
  const grade = parseGradeInput(raw);
  if(grade === undefined) return { ok: false, error: 'La nota debe estar entre 0 y 10.' };
  if(exam.grade === grade) return { ok: true, grade };
  exam.grade = grade;
  exam.updatedAt = Date.now();
  await saveExams();
  return { ok: true, grade };
}
/** Pone (o quita, con '') la nota final oficial de un trimestre. */
async function setSubjectTermFinal(subjectId, term, raw){
  const subject = state.subjects.find(s => s.id === subjectId);
  if(!subject) return { ok: false, error: 'Esta asignatura ya no existe.' };
  if(!EXAM_TERMS.includes(term)) return { ok: false, error: 'Trimestre no válido.' };
  const grade = parseGradeInput(raw);
  if(grade === undefined) return { ok: false, error: 'La nota debe estar entre 0 y 10.' };
  if(termFinalOf(subject, term) === grade) return { ok: true, grade };
  subject.termFinals = { 1: termFinalOf(subject, 1), 2: termFinalOf(subject, 2), 3: termFinalOf(subject, 3), [term]: grade };
  subject.updatedAt = Date.now();
  await saveSubjects();
  return { ok: true, grade };
}

function gradeInputHTML(attrs, value, label){
  return `<input type="text" class="grade-input" inputmode="decimal" maxlength="5" ${attrs} value="${value === null ? '' : esc(formatGrade(value))}" placeholder="—" aria-label="${esc(label)}">`;
}
function notasExamRowHTML(exam){
  return `
    <div class="notas-exam">
      <div class="notas-exam-main">
        <div class="notas-exam-title">${esc(exam.title)}</div>
        <div class="notas-exam-meta">${esc(examTypeLabel(exam.type))} · ${esc(humanDateShort(exam.date))}</div>
      </div>
      ${gradeInputHTML(`data-exam-grade="${esc(exam.id)}"`, typeof exam.grade === 'number' ? exam.grade : null, `Nota de ${exam.title}`)}
    </div>`;
}
/* ---------- Notas: desplegables ----------
   Cada asignatura es un desplegable (cerrado: nombre, color y la media de
   cada trimestre) y dentro cada trimestre es otro. Por defecto las
   asignaturas salen cerradas y, dentro, solo el trimestre actual abierto.
   Lo que el usuario abre o cierra se recuerda en este dispositivo
   (localStorage, no se sincroniza). Las asignaturas que no llevan nota
   (subject.graded === false) no salen aquí. */
const NOTAS_OPEN_KEY = 'organizator:notasOpen:v1';
function loadNotasOpen(){
  try{
    const v = JSON.parse(localStorage.getItem(NOTAS_OPEN_KEY) || 'null');
    if(v && typeof v === 'object') return { subjects: (v.subjects && typeof v.subjects === 'object') ? v.subjects : {}, terms: (v.terms && typeof v.terms === 'object') ? v.terms : {} };
  }catch(e){}
  return { subjects: {}, terms: {} };
}
function saveNotasOpen(open){
  try{ localStorage.setItem(NOTAS_OPEN_KEY, JSON.stringify(open)); }catch(e){}
}
/** true salvo que la asignatura diga expresamente que no lleva nota. */
function isSubjectGraded(subject){
  return !subject || subject.graded !== false;
}
function notasTermAvgHTML(subjectId, term){
  const avg = termAverage(subjectTermExams(subjectId, term));
  return `<strong data-term-avg="${esc(subjectId)}|${term}">${avg === null ? '—' : esc(formatGrade(avg))}</strong>`;
}

function renderNotasHTML(open = loadNotasOpen(), currentTerm = termForDate(todayStr())){
  const subjects = [...state.subjects].filter(isSubjectGraded).sort((a,b) => (a.name||'').localeCompare(b.name||'', 'es'));
  if(!subjects.length){
    return state.subjects.length
      ? `<div class="empty-state">Ninguna asignatura lleva nota. Puedes cambiarlo en Ajustes › Asignaturas.</div>`
      : `<div class="empty-state">Primero añade tus asignaturas en Ajustes › Asignaturas.</div>`;
  }
  return subjects.map(subject => {
    const terms = EXAM_TERMS.map(term => {
      const exams = subjectTermExams(subject.id, term);
      const key = `${subject.id}|${term}`;
      const isOpen = Object.prototype.hasOwnProperty.call(open.terms, key) ? !!open.terms[key] : term === currentTerm;
      return `
        <details class="notas-term" data-notas-term="${esc(key)}"${isOpen ? ' open' : ''}>
          <summary class="notas-term-head"><span>${term}.º trimestre${term === currentTerm ? ' <span class="notas-now">(ahora)</span>' : ''}</span><span class="notas-term-avg">${notasTermAvgHTML(subject.id, term)}</span></summary>
          <div class="notas-term-body">
            ${exams.length ? exams.map(notasExamRowHTML).join('') : `<div class="notas-empty">Sin exámenes ni entregas.</div>`}
            <div class="notas-summary">
              <div class="notas-avg">Media: ${notasTermAvgHTML(subject.id, term)}</div>
              <label class="notas-final">Nota final oficial
                ${gradeInputHTML(`data-term-final="${esc(subject.id)}|${term}"`, termFinalOf(subject, term), `Nota final oficial del ${term}.º trimestre de ${subject.name}`)}
              </label>
            </div>
          </div>
        </details>`;
    }).join('');
    const noTerm = subjectTermExams(subject.id, null);
    const noTermKey = `${subject.id}|none`;
    const noTermHTML = noTerm.length ? `
        <details class="notas-term" data-notas-term="${esc(noTermKey)}"${open.terms[noTermKey] ? ' open' : ''}>
          <summary class="notas-term-head"><span>Sin trimestre</span></summary>
          <div class="notas-term-body">${noTerm.map(notasExamRowHTML).join('')}</div>
        </details>` : '';
    const summary = EXAM_TERMS.map(t => `<span>${t}.º ${notasTermAvgHTML(subject.id, t)}</span>`).join(' · ');
    return `
      <details class="block notas-subject" data-notas-subject="${esc(subject.id)}" style="border-left-color:${esc(subject.color)};"${open.subjects[subject.id] ? ' open' : ''}>
        <summary class="notas-subject-head">
          <span class="notas-subject-name"><span class="priority-dot subject-dot" style="background:${esc(subject.color)};"></span>${esc(subject.name)}</span>
          <span class="notas-subject-sum">${summary}</span>
        </summary>
        <div class="notas-terms">${terms}${noTermHTML}</div>
      </details>`;
  }).join('');
}
function renderNotas(){
  const el = document.getElementById('view-notas');
  if(!el) return;
  const open = loadNotasOpen();
  el.innerHTML = `
    <div class="area-head">
      <div class="area-head-l">
        <div class="ic" style="background:var(--paper);color:var(--ink);">📝</div>
        <div><h1>Notas</h1><p>Tus notas y la media de cada trimestre</p></div>
      </div>
      <button type="button" class="btn btn-sm" id="notas-toggle-all" style="width:auto;" hidden></button>
    </div>
    ${renderNotasHTML(open)}`;
  const allDetails = () => [...el.querySelectorAll('details[data-notas-subject], details[data-notas-term]')];
  const remember = (d) => {
    if(d.dataset.notasSubject) open.subjects[d.dataset.notasSubject] = d.open;
    else open.terms[d.dataset.notasTerm] = d.open;
  };
  const toggleAllBtn = el.querySelector('#notas-toggle-all');
  const updateToggleAll = () => {
    const list = allDetails();
    toggleAllBtn.hidden = !list.length;
    toggleAllBtn.textContent = list.length && list.every(d => d.open) ? 'Cerrar todo' : 'Abrir todo';
  };
  // Solo se guarda lo que toca el usuario (no los valores por defecto).
  allDetails().forEach(d => {
    d.querySelector(':scope > summary').addEventListener('click', () => {
      setTimeout(() => { remember(d); saveNotasOpen(open); updateToggleAll(); }, 0);
    });
  });
  toggleAllBtn.addEventListener('click', () => {
    const openAll = !allDetails().every(d => d.open);
    allDetails().forEach(d => { d.open = openAll; remember(d); });
    saveNotasOpen(open);
    updateToggleAll();
  });
  updateToggleAll();
  // Las medias se actualizan en su sitio (sin repintar la vista, para no
  // quitar el foco de la casilla siguiente).
  const refreshAverages = () => {
    el.querySelectorAll('[data-term-avg]').forEach(out => {
      const [subjectId, term] = out.dataset.termAvg.split('|');
      const avg = termAverage(subjectTermExams(subjectId, Number(term)));
      out.textContent = avg === null ? '—' : formatGrade(avg);
    });
  };
  // Se guarda al salir de la casilla o al pulsar Intro; si no vale, se avisa y se deja como estaba.
  const bind = (input, save, current) => {
    const commit = async () => {
      const result = await save(input.value);
      if(!result.ok){ showToast(result.error); input.value = current() === null ? '' : formatGrade(current()); return; }
      input.value = result.grade === null ? '' : formatGrade(result.grade);
      refreshAverages();
    };
    input.addEventListener('change', commit);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); input.blur(); } });
  };
  el.querySelectorAll('[data-exam-grade]').forEach(input => {
    const id = input.dataset.examGrade;
    bind(input, (v) => setExamGrade(id, v), () => { const e = state.exams.find(x => x && x.id === id); return e && typeof e.grade === 'number' ? e.grade : null; });
  });
  el.querySelectorAll('[data-term-final]').forEach(input => {
    const [subjectId, term] = input.dataset.termFinal.split('|');
    bind(input, (v) => setSubjectTermFinal(subjectId, Number(term), v), () => termFinalOf(state.subjects.find(s => s.id === subjectId), Number(term)));
  });
}

/* Paso 4D: filas de duración por categoría, usando SOLO categorías reales
   que ya existen en las tareas (nunca se inventa una lista de categorías).
   Cada fila usa DurationLearning.getStatsForCategory, y una categoría se
   omite por completo si no llega a minSamples — nunca se muestra una
   estadística poco fiable ni una categoría vacía. */
function renderCategoryDurationRows(minSamples){
  const categories = Array.from(new Set(
    state.tasks
      .map(t => (t && t.category) ? String(t.category).trim() : '')
      .filter(c => c.length > 0)
  )).sort((a, b) => a.localeCompare(b));

  return categories
    .map(cat => {
      const stats = DurationLearning.getStatsForCategory(cat, state.tasks);
      if(stats.count < minSamples) return null;
      return `<div class="settings-row"><div class="left stack"><div>${esc(cat)}</div><div class="row-sub">${stats.count} muestras</div></div><div>Media ${stats.mean} min · Mediana ${stats.median} min</div></div>`;
    })
    .filter(Boolean)
    .join('');
}

/* Paso 4C: sección de solo lectura con las estadísticas reales que
   DurationLearning calcula a partir de las tareas completadas con
   actualMinutes. No modifica ninguna tarea, no cambia el Scheduler y no
   inventa datos: si no hay muestras suficientes, muestra un mensaje claro
   en vez de una estadística poco fiable. */
function renderDurationStatsSection(){
  if(!window.DurationLearning || !Array.isArray(state.tasks)){
    return `
    <section class="block">
      <div class="block-head"><h2>Estadísticas de duración</h2></div>
      <p class="hint" style="display:block;">No hay datos de duración disponibles todavía.</p>
    </section>`;
  }
  const minSamples = (DurationLearning.DEFAULTS && DurationLearning.DEFAULTS.minSamples) || 3;
  const stats = DurationLearning.getStats(state.tasks, () => true);
  if(stats.count < minSamples){
    return `
    <section class="block">
      <div class="block-head"><h2>Estadísticas de duración</h2><span class="hint">Basadas en tareas completadas con tiempo real registrado</span></div>
      <p class="hint" style="display:block;">Aún no hay tareas suficientes con tiempo real registrado para calcular estadísticas fiables (mínimo ${minSamples}, llevas ${stats.count}).</p>
    </section>`;
  }
  const trendLabel = {
    up: 'Al alza — últimamente tardas más',
    down: 'A la baja — últimamente tardas menos',
    stable: 'Estable',
  }[stats.trend] || 'Sin datos suficientes todavía';
  const categoryRows = renderCategoryDurationRows(minSamples);
  const categoryBlock = categoryRows
    ? `
      <div class="block-head" style="margin-top:16px;"><h3 style="margin:0;font-size:14px;">Por categoría</h3></div>
      <div class="settings-list">
        ${categoryRows}
      </div>`
    : '';
  return `
    <section class="block">
      <div class="block-head"><h2>Estadísticas de duración</h2><span class="hint">Basadas en tareas completadas con tiempo real registrado</span></div>
      <div class="settings-list">
        <div class="settings-row"><div class="left">⏱️ Tiempo real medio</div><div>${stats.mean} min</div></div>
        <div class="settings-row"><div class="left">📊 Mediana</div><div>${stats.median} min</div></div>
        <div class="settings-row"><div class="left">🔢 Número de muestras</div><div>${stats.count}</div></div>
        <div class="settings-row"><div class="left">📈 Tendencia reciente</div><div>${trendLabel}</div></div>
      </div>
      ${categoryBlock}
    </section>`;
}

/* Paso 4E: patrones generales calculados por DurationLearning a partir de
   datos reales (scheduledDate/scheduledStart de tareas completadas,
   category, y comparación estimatedMinutes vs actualMinutes). Cada
   patrón se calcula y se muestra de forma INDEPENDIENTE: si uno no tiene
   muestras suficientes, esa línea concreta simplemente no aparece (nunca
   se inventa ni se rellena con datos aproximados). Si ningún patrón tiene
   datos todavía, no se añade ninguna sección vacía. No modifica ninguna
   tarea ni estimación, y no toca el Scheduler. */
function renderGeneralPatternsSection(){
  if(!window.DurationLearning || !Array.isArray(state.tasks)) return '';

  const rows = [];

  const busiestDays = DurationLearning.getBusiestDaysOfWeek(state.tasks);
  if(busiestDays && busiestDays.length){
    const top = busiestDays.slice(0, 3).map(d => `${esc(d.day)} (${d.count})`).join(', ');
    rows.push(`<div class="settings-row"><div class="left">📅 Días con más tareas completadas</div><div>${top}</div></div>`);
  }

  const busyHours = DurationLearning.getBusyHourSlots(state.tasks);
  if(busyHours && busyHours.length){
    const top = busyHours.slice(0, 3).map(h => `${esc(h.slot)} (${h.count})`).join(', ');
    rows.push(`<div class="settings-row"><div class="left">🕐 Franjas horarias habituales</div><div>${top}</div></div>`);
  }

  const slowestCategories = DurationLearning.getCategoryDurationRanking(state.tasks);
  if(slowestCategories && slowestCategories.length){
    const top = slowestCategories.slice(0, 3).map(c => `${esc(c.category)} (${c.mean} min)`).join(', ');
    rows.push(`<div class="settings-row"><div class="left">📚 Categorías que suelen tardar más</div><div>${top}</div></div>`);
  }

  const overEstimate = DurationLearning.getTasksOverEstimate(state.tasks);
  if(overEstimate && overEstimate.length){
    const top = overEstimate.slice(0, 5).map(t => `${esc(t.title)} (+${t.overrunMinutes} min)`).join(', ');
    rows.push(`<div class="settings-row"><div class="left">⚠️ Tareas que suelen tardar más de lo estimado</div><div>${top}</div></div>`);
  }

  if(!rows.length) return '';

  return `
    <section class="block">
      <div class="block-head"><h2>Patrones generales</h2><span class="hint">Solo se muestran cuando hay suficientes datos reales</span></div>
      <div class="settings-list">
        ${rows.join('')}
      </div>
    </section>`;
}

/* UX-7 (acordeón): qué categorías de Ajustes están abiertas/cerradas.
   Vive a nivel de módulo (mismo patrón que `cal`/`week`): es solo estado
   de UI de esta sesión, nunca se guarda ni se exporta. Persiste ENTRE
   llamadas a renderAjustes() — necesario porque un par de controles de
   dentro de Ajustes sí
   vuelven a renderizar toda la vista; sin esto, cualquier categoría que
   el usuario hubiera cerrado se reabriría sola al tocar esos controles.
   Todas las categorías empiezan abiertas la primera vez (mismo contenido
   visible que antes de este cambio). */
let ajustesAccordionOpen = {};
function isAjustesGroupOpen(key){
  if(!(key in ajustesAccordionOpen)) ajustesAccordionOpen[key] = true;
  return ajustesAccordionOpen[key];
}
/** Envuelve el HTML de una categoría de Ajustes en un panel de acordeón
 * con su cabecera-botón (nombre + chevron). Puramente de presentación:
 * `contentHtml` es exactamente el mismo HTML que antes vivía dentro de
 * cada `<div class="settings-group">` — no crea, renombra ni quita
 * ningún control existente. */
function ajustesAccordionSection(key, title, contentHtml){
  const open = isAjustesGroupOpen(key);
  return `
    <div class="settings-accordion-item">
      <button type="button" class="settings-accordion-header" data-accordion="${key}" aria-expanded="${open}" aria-controls="accordion-panel-${key}">
        <span>${esc(title)}</span>
        <span class="settings-accordion-chevron" aria-hidden="true">▾</span>
      </button>
      <div class="settings-accordion-panel" id="accordion-panel-${key}"${open?'':' hidden'}>
        ${contentHtml}
      </div>
    </div>`;
}
