/* ---------- Exportar / Importar / Borrar datos ---------- */
function exportData(){
  const payload = {
    app: APP_NAME,
    version: APP_VERSION,
    exportedAt: new Date().toISOString(),
    data: {
      tasks: state.tasks,
      events: state.events,
      customSchedules: state.customSchedules,
      eventCategories: state.eventCategories,
      reminders: state.reminders,
      subjects: state.subjects,
      exams: state.exams,
      studySessions: state.studySessions,
      prefs: state.prefs,
      ia: state.ia,
    }
  };
  try{
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `organizator-backup-${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Datos exportados');
  }catch(err){
    console.error(err);
    showToast('No se pudo exportar. Inténtalo de nuevo.');
  }
}

/* ==================================================================
   FECHAS VÁLIDAS (YYYY-MM-DD)
   Comprobación de fecha real que usan los exámenes al validar el formulario.
   ================================================================== */
const IMPORT_DATE_YMD_RE = /^\d{4}-\d{2}-\d{2}$/;

/** true si `str` tiene formato YYYY-MM-DD Y además es una fecha de
 * calendario real (rechaza "2026-02-31", "2026-13-01", "2026-00-10"...).
 * new Date(y, m-1, d) "desborda" fechas imposibles a otro mes/día en vez
 * de lanzar, así que se comprueba que el resultado siga teniendo el
 * mismo año/mes/día que se pidió. */
function isValidYMDDate(str){
  if(typeof str !== 'string' || !IMPORT_DATE_YMD_RE.test(str)) return false;
  const [y, m, d] = str.split('-').map(Number);
  if(m < 1 || m > 12) return false;
  const date = new Date(y, m - 1, d);
  return date.getFullYear() === y && date.getMonth() === m - 1 && date.getDate() === d;
}

/** Valida una lista importada de asignaturas, exámenes o sesiones de
 * estudio (STUDY_KEYS). Solo descarta lo que rompería la sincronización:
 * elementos que no son objetos o sin `id` de texto no vacío (sync-merge.js
 * fusiona por id). El resto de campos se conserva tal cual. Una copia
 * antigua sin estas claves deja la lista vacía, como el resto del import.
 * Devuelve { kept, discarded }. */
function sanitizeImportedStudyItems(arr){
  const kept = [];
  let discarded = 0;
  (Array.isArray(arr) ? arr : []).forEach(item=>{
    const hasId = item && typeof item === 'object' && !Array.isArray(item) && typeof item.id === 'string' && item.id.trim().length > 0;
    if(!hasId){ discarded++; return; }
    kept.push({ ...item });
  });
  return { kept, discarded };
}

/** Valida las asignaturas de una copia importada (ya filtradas por id):
 * sin nombre -> se descarta; color que no es #RRGGBB -> el primero de la
 * paleta; passGrade no válido -> DEFAULT_PASS_GRADE. { kept, discarded }. */
function sanitizeImportedSubjects(arr){
  const kept = [];
  let discarded = 0;
  (Array.isArray(arr) ? arr : []).forEach(s=>{
    const name = s && typeof s.name === 'string' ? s.name.trim() : '';
    if(!name){ discarded++; return; }
    const passGrade = parsePassGrade(s.passGrade);
    kept.push({
      ...s,
      name,
      color: HEX_COLOR_RE.test(s.color || '') ? s.color : SUBJECT_COLORS[0].color,
      passGrade: passGrade === null ? DEFAULT_PASS_GRADE : passGrade,
    });
  });
  return { kept, discarded };
}

function initSettingsDataIO(){
  const input = document.getElementById('import-file-input');
  if(!input) return;
  input.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    input.value = '';
    if(!file) return;
    let parsed;
    try{
      const text = await file.text();
      parsed = JSON.parse(text);
    }catch(err){
      showToast('El archivo no es un JSON válido');
      return;
    }
    const data = (parsed && typeof parsed === 'object' && parsed.data) ? parsed.data : parsed;
    if(!data || typeof data !== 'object'){
      showToast('El archivo no tiene el formato esperado');
      return;
    }
    const ok = confirm('Vas a reemplazar TODOS los datos actuales de ORGANIZATOR de tu cuenta por los del archivo importado. El cambio se aplicará en todos tus dispositivos y no se puede deshacer. ¿Quieres continuar?');
    if(!ok) return;

    // Tareas, eventos, categorías y recordatorios ya no se usan en la app,
    // pero sus datos se conservan: se importan tal cual (solo que sean listas).
    state.tasks = Array.isArray(data.tasks) ? data.tasks : [];
    state.events = Array.isArray(data.events) ? data.events : [];
    state.customSchedules = Array.isArray(data.customSchedules) ? data.customSchedules : [];
    state.eventCategories = Array.isArray(data.eventCategories) ? data.eventCategories : [];
    state.reminders = Array.isArray(data.reminders) ? data.reminders : [];
    const sanitizedStudy = {};
    for(const key of STUDY_KEYS){
      sanitizedStudy[key] = sanitizeImportedStudyItems(data[key]);
      state[key] = sanitizedStudy[key].kept;
    }
    // Paso 2: además, las asignaturas necesitan nombre, color y nota de aprobado válidos.
    const sanitizedSubjects = sanitizeImportedSubjects(state.subjects);
    state.subjects = sanitizedSubjects.kept;
    sanitizedStudy.subjects.discarded += sanitizedSubjects.discarded;
    // R-8.2-C: el registro de reconciliación es puramente interno (no
    // forma parte del formato exportado/importado, ver exportData()) —
    // se reinicia al importar, porque cualquier marca antigua ya no
    // tiene sentido para el conjunto de reminders que se acaba de
    // reemplazar por completo.
    state.reminderNotificationLedger = {};
    state.prefs = { ...defaultPrefs(), ...(data.prefs||{}) };
    state.ia = { ...defaultIA(), ...(data.ia||{}) };

    // R-8.2-D: mismo criterio que el registro de arriba, aplicado al
    // ledger PERSISTENTE del Service Worker (window.SWPushLedger) —
    // igualmente interno, ajeno al formato importado/exportado. Sin
    // esto, una marca de "reminderId X ya avisó" de un conjunto de
    // reminders anterior podría "contaminar" un reminderId nuevo que
    // coincidiera tras el import (ids reutilizados, datos de otra
    // exportación...). Best-effort: un fallo aquí no debe impedir
    // completar el resto del import.
    if(typeof self !== 'undefined' && self.SWPushLedger && typeof self.SWPushLedger.clearAll === 'function'){
      try{ await self.SWPushLedger.clearAll(); }catch(e){ console.error('No se pudo reiniciar el ledger persistente de push tras importar', e); }
    }

    // Paso 2b: una clase cuya asignatura no viene en la copia se queda como bloque normal.
    state.customSchedules = state.customSchedules.map(s =>
      (s && s.subjectId && !state.subjects.some(x => x.id === s.subjectId)) ? { ...s, subjectId: null } : s
    );

    try{
      await Promise.all([
        saveTasks(), saveEvents(), saveCustomSchedules(), saveEventCategories(), saveReminders(),
        saveSubjects(), saveExams(), saveStudySessions(),
        saveReminderNotificationLedger(), savePrefs(), saveIA(),
      ]);
      const discardedParts = [];
      if(sanitizedStudy.subjects.discarded) discardedParts.push(`${sanitizedStudy.subjects.discarded} asignatura(s)`);
      if(sanitizedStudy.exams.discarded) discardedParts.push(`${sanitizedStudy.exams.discarded} examen(es)`);
      if(sanitizedStudy.studySessions.discarded) discardedParts.push(`${sanitizedStudy.studySessions.discarded} sesión(es) de estudio`);
      // SYNC: se sube ya a la cuenta (sin esperar al debounce) para poder
      // decir si el cambio ha llegado a los demás dispositivos.
      const uploaded = (typeof flushAccountChanges === 'function') ? await flushAccountChanges() : true;
      const pendingNote = uploaded ? '' : ' (se subirán a tu cuenta al volver la conexión)';
      showToast((discardedParts.length
        ? `Datos importados; se ignoraron ${discardedParts.join(' y ')} por estar incompletos`
        : 'Datos importados correctamente') + pendingNote);
      showView('inicio');
    }catch(err){
      console.error(err);
      showToast('Hubo un problema guardando los datos importados');
    }
  });
}

async function deleteAllData(){
  const ok1 = confirm('Esto borrará PERMANENTEMENTE todos los datos de ORGANIZATOR de tu cuenta (tareas, eventos y ajustes) en TODOS tus dispositivos. Esta acción no se puede deshacer. ¿Seguro que quieres continuar?');
  if(!ok1) return;
  const ok2 = confirm('Última confirmación: se van a borrar todos los datos de tu cuenta ahora mismo. ¿Confirmas el borrado?');
  if(!ok2) return;

  state.tasks = [];
  state.events = [];
  state.customSchedules = [];
  state.eventCategories = [];
  state.reminders = [];
  state.subjects = [];
  state.exams = [];
  state.studySessions = [];
  state.reminderNotificationLedger = {}; // R-8.2-C: interno, se borra junto con los reminders
  state.prefs = defaultPrefs();
  state.ia = defaultIA();

  // R-8.2-D: mismo criterio, aplicado al ledger PERSISTENTE del Service
  // Worker — ver el mismo razonamiento en importData(), más arriba.
  // Best-effort: un fallo aquí no debe impedir borrar el resto de datos.
  if(typeof self !== 'undefined' && self.SWPushLedger && typeof self.SWPushLedger.clearAll === 'function'){
    try{ await self.SWPushLedger.clearAll(); }catch(e){ console.error('No se pudo reiniciar el ledger persistente de push al borrar los datos', e); }
  }

  try{
    await Promise.all([
      saveTasks(), saveEvents(), saveCustomSchedules(), saveEventCategories(), saveReminders(),
      saveSubjects(), saveExams(), saveStudySessions(),
      saveReminderNotificationLedger(), savePrefs(), saveIA(),
    ]);
    // SYNC: mismo criterio que al importar (ver initSettingsDataIO).
    const uploaded = (typeof flushAccountChanges === 'function') ? await flushAccountChanges() : true;
    showToast(uploaded
      ? 'Todos los datos se han borrado'
      : 'Todos los datos se han borrado en este dispositivo; se borrarán de tu cuenta al volver la conexión');
    showView('inicio');
  }catch(err){
    console.error(err);
    showToast('Hubo un problema al borrar los datos');
  }
}

/* ==================================================================
   PWA — registro del Service Worker y control de actualizaciones.
   No toca window.storage ni ningún dato del usuario: solo gestiona
   la caché del "shell" estático de la app.
   ================================================================== */
function initPWA(){
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('/sw.js').then(reg=>{
    // Si ya hay un SW esperando (por ejemplo, se abrió una pestaña nueva
    // después de que otra ya descargara la actualización), avisamos ya.
    if(reg.waiting && navigator.serviceWorker.controller){
      showUpdateBanner(reg);
    }
    reg.addEventListener('updatefound', ()=>{
      const installing = reg.installing;
      if(!installing) return;
      installing.addEventListener('statechange', ()=>{
        // 'installed' + ya había un controller = es una actualización real,
        // no la primera instalación de la PWA.
        if(installing.state === 'installed' && navigator.serviceWorker.controller){
          showUpdateBanner(reg);
        }
      });
    });
  }).catch(err=> console.warn('No se pudo registrar el Service Worker', err));

  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(reloading) return;
    reloading = true;
    location.reload();
  });

}
function showUpdateBanner(reg){
  const banner = document.getElementById('update-banner');
  const btn = document.getElementById('update-banner-btn');
  if(!banner || !btn) return;
  banner.classList.add('show');
  btn.onclick = ()=>{
    if(reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
    banner.classList.remove('show');
  };
}

/* ==================================================================
   AUTENTICACIÓN (registro / inicio de sesión)
   Los datos (tareas, eventos…) se siguen guardando con window.storage,
   pero desde SYNC ese window.storage es el de la CUENTA que ha iniciado
   sesión (js/sync-storage.js): caché local propia de cada usuario,
   sincronizada con /api/data. Ver activateAccountStorage() más abajo.
   ================================================================== */
let currentUser = null;
let appStarted = false;

// Último usuario que inició sesión en ESTE dispositivo: solo id/email/
// nombre (nunca el token, que sigue en la cookie httpOnly). Permite abrir
// la app sin conexión con su caché. Se borra al cerrar sesión.
const LAST_USER_KEY = 'organizator:lastUser';
// Si se cerró sesión sin conexión, la cookie no se pudo borrar en el
// servidor: esta marca hace que se termine de cerrar al volver la red, en
// vez de volver a entrar solo en esa cuenta.
const LOGOUT_PENDING_KEY = 'organizator:logoutPending';

function rememberLastUser(user){
  try{ localStorage.setItem(LAST_USER_KEY, JSON.stringify({ id:user.id, email:user.email, name:user.name||null })); }catch(e){}
}
function readLastUser(){
  try{
    const u = JSON.parse(localStorage.getItem(LAST_USER_KEY) || 'null');
    return (u && u.id !== undefined && u.id !== null) ? u : null;
  }catch(e){ return null; }
}
function forgetLastUser(){
  try{ localStorage.removeItem(LAST_USER_KEY); }catch(e){}
}
function isLogoutPending(){
  try{ return localStorage.getItem(LOGOUT_PENDING_KEY) === '1'; }catch(e){ return false; }
}
function setLogoutPending(pending){
  try{ if(pending) localStorage.setItem(LOGOUT_PENDING_KEY, '1'); else localStorage.removeItem(LOGOUT_PENDING_KEY); }catch(e){}
}

/** Comprueba la sesión distinguiendo "no hay sesión" (401) de "no se
 * pudo comprobar" (sin red o fallo del servidor): en el segundo caso la
 * app puede abrirse sin conexión con el último usuario. Nunca lanza. */
async function checkSession(){
  try{
    const res = await fetch('/api/auth/me', { credentials:'same-origin', cache:'no-store' });
    if(res.status === 401) return { user:null, offline:false };
    if(!res.ok) return { user:null, offline:true };
    const data = await res.json();
    return { user: data.user || null, offline:false };
  }catch(e){ return { user:null, offline:true }; }
}

function showAuthScreen(){
  document.getElementById('auth-screen').classList.remove('hidden');
  document.getElementById('app').style.display = 'none';
}
function hideAuthScreen(){
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('app').style.display = '';
}
function setAuthError(msg){
  const box = document.getElementById('auth-error');
  if(!msg){ box.classList.remove('show'); box.textContent = ''; return; }
  box.textContent = msg;
  box.classList.add('show');
}
function setAuthMode(mode){
  const loginForm = document.getElementById('login-form');
  const registerForm = document.getElementById('register-form');
  const switchText = document.getElementById('auth-switch-text');
  const switchBtn = document.getElementById('auth-switch-btn');
  setAuthError(null);
  if(mode === 'register'){
    loginForm.classList.add('hidden');
    registerForm.classList.remove('hidden');
    switchText.textContent = '¿Ya tienes cuenta?';
    switchBtn.textContent = 'Inicia sesión';
    switchBtn.dataset.mode = 'login';
  } else {
    registerForm.classList.add('hidden');
    loginForm.classList.remove('hidden');
    switchText.textContent = '¿No tienes cuenta?';
    switchBtn.textContent = 'Regístrate';
    switchBtn.dataset.mode = 'register';
  }
}

function initAuthScreen(){
  const loginForm = document.getElementById('login-form');
  const registerForm = document.getElementById('register-form');
  const switchBtn = document.getElementById('auth-switch-btn');

  switchBtn.addEventListener('click', ()=> setAuthMode(switchBtn.dataset.mode || 'register'));

  loginForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    setAuthError(null);
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const btn = document.getElementById('login-submit');
    btn.disabled = true; btn.textContent = 'Entrando…';
    try{
      const res = await fetch('/api/auth/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        credentials:'same-origin',
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if(!res.ok){ setAuthError(data.error || 'No se pudo iniciar sesión.'); return; }
      await onSignedIn(data.user);
    }catch(err){
      console.error(err);
      setAuthError('No se pudo conectar con el servidor. Comprueba tu conexión e inténtalo de nuevo.');
    }finally{
      btn.disabled = false; btn.textContent = 'Iniciar sesión';
    }
  });

  registerForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    setAuthError(null);
    const name = document.getElementById('register-name').value.trim();
    const email = document.getElementById('register-email').value.trim();
    const password = document.getElementById('register-password').value;
    const btn = document.getElementById('register-submit');
    btn.disabled = true; btn.textContent = 'Creando cuenta…';
    try{
      const res = await fetch('/api/auth/register', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        credentials:'same-origin',
        body: JSON.stringify({ name, email, password }),
      });
      const data = await res.json();
      if(!res.ok){ setAuthError(data.error || 'No se pudo crear la cuenta.'); return; }
      await onSignedIn(data.user);
    }catch(err){
      console.error(err);
      setAuthError('No se pudo conectar con el servidor. Comprueba tu conexión e inténtalo de nuevo.');
    }finally{
      btn.disabled = false; btn.textContent = 'Crear cuenta';
    }
  });
}

/** Tras un login/registro correcto. Si la app ya estaba abierta (sesión
 * caducada a mitad de uso), se recarga para empezar limpia con la cuenta
 * que acaba de entrar, en vez de arrancarla por segunda vez encima. */
async function onSignedIn(user){
  currentUser = user;
  setLogoutPending(false);
  rememberLastUser(user);
  if(appStarted){ location.reload(); return; }
  hideAuthScreen();
  await startApp();
}

/* ---------- SYNC: almacén de datos de la cuenta ---------- */
let syncStatus = 'idle';
let remoteReloadTimer = null;

/** Sustituye window.storage por el almacén de la cuenta actual (caché
 * propia de este usuario + sincronización con /api/data) y hace la
 * primera descarga si hay red. Si la capa de sincronización no se pudo
 * cargar, NO se sigue con el almacén antiguo del navegador (compartido
 * entre cuentas): se avisa y la app no carga datos. */
async function activateAccountStorage(){
  const fail = (err) => {
    if(err) console.error('No se pudo activar el almacén de la cuenta', err);
    document.getElementById('upcoming-exams').innerHTML = `<div class="empty-state small">No se pudieron cargar tus datos. Recarga la página.</div>`;
    showToast('No se pudieron cargar tus datos. Recarga la página.');
    return false;
  };
  if(typeof SyncStorage === 'undefined' || !SyncStorage || typeof SyncStorage.activate !== 'function') return fail(null);
  try{
    await SyncStorage.activate(currentUser, {
      onRemoteChange: handleRemoteDataChange,
      onUnauthorized: handleSessionExpired,
      onStatusChange: (status)=>{ syncStatus = status; updateSyncStatusIndicator(); },
    });
    return true;
  }catch(err){ return fail(err); }
}

/** Texto de la línea "Sincronización" de Ajustes → Cuenta. */
function syncStatusText(){
  const store = (typeof SyncStorage !== 'undefined' && SyncStorage) ? SyncStorage.current() : null;
  if(!store) return 'No disponible';
  const info = store.getStatus();
  const pad2 = (n) => String(n).padStart(2, '0');
  const when = info.lastSyncAt ? (()=>{ const d = new Date(info.lastSyncAt); return ` · última vez a las ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; })() : '';
  let text;
  switch(info.status){
    case 'synced': text = `Todo guardado en tu cuenta${when}`; break;
    case 'syncing': text = 'Sincronizando…'; break;
    case 'pending': text = 'Hay cambios que todavía no se han subido a tu cuenta…'; break;
    case 'offline': text = 'Sin conexión: tus cambios se guardan en este dispositivo y se subirán al volver la red.'; break;
    case 'unauthorized': text = 'Tu sesión ha caducado. Vuelve a iniciar sesión para sincronizar.'; break;
    case 'error': text = 'No se pudo sincronizar ahora. Se volverá a intentar automáticamente.'; break;
    default: text = 'Preparando…';
  }
  if(info.persistent === false) text += ' (Este navegador no permite guardar una copia en el dispositivo: sin conexión no se conservarán los cambios.)';
  return text;
}

/** Actualiza solo esa línea (sin repintar Ajustes entero). */
function updateSyncStatusIndicator(){
  const el = document.getElementById('sync-status-text');
  if(el) el.textContent = syncStatusText();
}

/** Botón "Sincronizar ahora" de Ajustes. */
async function syncNow(){
  const store = (typeof SyncStorage !== 'undefined' && SyncStorage) ? SyncStorage.current() : null;
  if(!store) return;
  const btn = document.getElementById('btn-sync-now');
  if(btn) btn.disabled = true;
  try{ await store.sync(); }
  finally{
    if(btn) btn.disabled = false;
    updateSyncStatusIndicator();
  }
}

/** Sube ya lo pendiente de la cuenta (tras importar o borrar todo).
 * Devuelve true si todo quedó guardado en el servidor. Nunca lanza. */
async function flushAccountChanges(){
  const store = (typeof SyncStorage !== 'undefined' && SyncStorage) ? SyncStorage.current() : null;
  if(!store) return true;
  try{ return await store.flush(); }catch(e){ return false; }
}

/** Han llegado cambios de otro dispositivo: se recarga el estado y se
 * repinta. Si hay un formulario abierto se espera a que se cierre, para
 * no cambiarle los datos al usuario mientras edita. */
async function handleRemoteDataChange(){
  if(remoteReloadTimer){ clearTimeout(remoteReloadTimer); remoteReloadTimer = null; }
  if(overlay && overlay.classList.contains('open')){
    remoteReloadTimer = setTimeout(handleRemoteDataChange, 2000);
    return;
  }
  await loadState();
  renderCurrentView();
}

/** La cookie de sesión ya no es válida (caducó o se cerró en otro sitio):
 * se vuelve a la pantalla de login. Los cambios pendientes siguen en la
 * caché de este usuario y se subirán cuando vuelva a entrar. */
function handleSessionExpired(){
  setAuthError('Tu sesión ha caducado. Inicia sesión de nuevo; tus cambios se guardan en este dispositivo hasta entonces.');
  showAuthScreen();
}

/* ---------- SYNC — migración de datos antiguos (antes de las cuentas) ----------
   Hasta ahora los datos se guardaban en una base del navegador compartida
   por todas las cuentas ('organizator-storage'). La primera vez que
   alguien entra tras este cambio y esa base tiene datos, se le pregunta
   qué hacer con ellos (ver showLegacyMigrationDialog). Reglas:
   - Nunca se sube nada sin que el usuario lo elija, y antes de subir o
     descartar se descarga una copia de seguridad (.json, mismo formato que
     "Exportar datos", así que se puede volver a importar).
   - La base antigua solo se borra cuando el servidor ha CONFIRMADO la
     subida (o, si se descartan, tras la copia). Sin conexión se conserva
     y se termina la próxima vez que se abra la app.
   - Los datos antiguos no tienen dueño: "No son míos" no borra nada, solo
     deja de preguntar a esa cuenta. Cuando una cuenta los pasa a su
     nombre quedan reservados (marca en localStorage) y ya no se ofrecen a
     otras cuentas mientras se termina la subida. */
const LEGACY_MIGRATION_KEY = 'organizator:legacyMigration';

function readLegacyMigrationMarker(){
  try{
    const m = JSON.parse(localStorage.getItem(LEGACY_MIGRATION_KEY) || 'null') || {};
    return {
      claimedBy: (m.claimedBy !== undefined && m.claimedBy !== null) ? String(m.claimedBy) : null,
      declinedBy: Array.isArray(m.declinedBy) ? m.declinedBy.map(String) : [],
    };
  }catch(e){ return { claimedBy:null, declinedBy:[] }; }
}
function writeLegacyMigrationMarker(m){
  try{
    if(!m || (!m.claimedBy && !(m.declinedBy || []).length)) localStorage.removeItem(LEGACY_MIGRATION_KEY);
    else localStorage.setItem(LEGACY_MIGRATION_KEY, JSON.stringify(m));
  }catch(e){}
}

/** Valores actuales de la cuenta (ya descargados en su caché). */
async function readAccountValues(store){
  const out = {};
  for(const key of SyncStorage.SYNCED_KEYS){
    const r = await store.storage.get(key);
    if(!r) continue;
    try{ out[key] = JSON.parse(r.value); }catch(e){}
  }
  return out;
}

/** Copia de seguridad de los datos antiguos, con el mismo formato que
 * "Exportar datos" (Ajustes) para poder importarla si hiciera falta. */
function downloadLegacyBackup(values){
  const payload = {
    app: APP_NAME,
    version: APP_VERSION,
    exportedAt: new Date().toISOString(),
    source: 'Datos guardados en este dispositivo antes de las cuentas',
    data: {
      tasks: values.tasks || [],
      events: values.events || [],
      customSchedules: values.customSchedules || [],
      eventCategories: values.eventCategories || [],
      reminders: values.reminders || [],
      prefs: values.settingsPrefs || {},
      ia: values.settingsIA || {},
    }
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `organizator-backup-datos-antiguos-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

/** "12 tareas, 5 eventos y 3 recordatorios" */
function legacyCountsText(counts){
  const parts = [];
  const add = (n, one, many) => { if(n) parts.push(`${n} ${n === 1 ? one : many}`); };
  add(counts.tasks, 'tarea', 'tareas');
  add(counts.events, 'evento', 'eventos');
  add(counts.reminders, 'recordatorio', 'recordatorios');
  add(counts.customSchedules, 'horario bloqueado', 'horarios bloqueados');
  add(counts.eventCategories, 'categoría de eventos', 'categorías de eventos');
  if(parts.length <= 1) return parts[0] || '';
  return parts.slice(0, -1).join(', ') + ' y ' + parts[parts.length - 1];
}

/** Aviso al usuario. Resuelve con 'upload' | 'combine' | 'discard' |
 * 'notMine' | 'later'. Cerrarlo pulsando fuera equivale a "Ahora no". */
function showLegacyMigrationDialog(legacySummary, accountSummary){
  return new Promise(resolve => {
    const accountHasData = accountSummary.hasListData;
    const email = currentUser && currentUser.email ? esc(currentUser.email) : 'tu cuenta';
    const samples = legacySummary.sampleTitles.length
      ? `<p class="row-sub">Por ejemplo: ${legacySummary.sampleTitles.map(t => `«${esc(t)}»`).join(', ')}.</p>`
      : '';
    modalBox.innerHTML = `
      <h3>Datos guardados en este dispositivo</h3>
      <p>En este dispositivo hay datos de ORGANIZATOR de antes de que existieran las cuentas: <strong>${esc(legacyCountsText(legacySummary.counts))}</strong>.</p>
      ${samples}
      <p>${accountHasData
        ? `Tu cuenta (${email}) ya tiene datos: ${esc(legacyCountsText(accountSummary.counts))}.`
        : `Tu cuenta (${email}) todavía está vacía.`} ¿Estos datos son tuyos?</p>
      <p class="row-sub">Antes de cambiar nada se descargará una copia de seguridad (.json) de estos datos.</p>
      <div class="migration-actions">
        ${accountHasData
          ? `<button type="button" class="btn btn-dark" data-choice="combine">Combinar con mi cuenta</button>
             <button type="button" class="btn" data-choice="discard">Usar solo los de mi cuenta</button>`
          : `<button type="button" class="btn btn-dark" data-choice="upload">Subir a mi cuenta</button>`}
        <button type="button" class="btn" data-choice="notMine">No son míos</button>
        <button type="button" class="btn btn-ghost" data-choice="later">Ahora no</button>
      </div>`;
    overlay.classList.add('open');
    let done = false;
    const onOutside = (e) => { if(e.target === overlay) finish('later'); };
    const finish = (choice) => {
      if(done) return;
      done = true;
      overlay.removeEventListener('click', onOutside);
      closeModal();
      resolve(choice);
    };
    overlay.addEventListener('click', onOutside);
    modalBox.querySelectorAll('[data-choice]').forEach(b => b.addEventListener('click', ()=> finish(b.dataset.choice)));
  });
}

/** Sube lo pendiente y, SOLO si el servidor lo confirma todo, borra la
 * base antigua. Si no hay conexión, la conserva (se reintenta al abrir la
 * app). Devuelve true si la base antigua quedó borrada. */
async function finishLegacyMigrationIfUploaded(store, announce, choice){
  const uploaded = await store.flush();
  if(!uploaded){
    if(announce){
      showToast(choice === 'discard'
        ? 'Los datos antiguos se quitarán de este dispositivo cuando se termine de sincronizar tu cuenta.'
        : 'Tus datos antiguos se subirán a tu cuenta en cuanto haya conexión. Mientras tanto se conservan en este dispositivo.');
    }
    return false;
  }
  const result = await SyncStorage.legacy.deleteLegacyData(window.indexedDB);
  if(result.deleted) writeLegacyMigrationMarker(null);
  if(announce){
    showToast(choice === 'discard'
      ? 'Listo: te quedas con los datos de tu cuenta (tienes la copia descargada).'
      : 'Listo: tus datos antiguos ya están en tu cuenta.');
  }
  return !!result.deleted;
}

/** Punto de entrada (desde startApp, antes de loadState). Nunca lanza:
 * un fallo aquí no debe impedir abrir la app. */
async function maybeMigrateLegacyData(){
  try{
    const store = (typeof SyncStorage !== 'undefined' && SyncStorage) ? SyncStorage.current() : null;
    const idb = window.indexedDB;
    if(!store || !SyncStorage.legacy || !idb || !currentUser) return;
    const uid = String(currentUser.id);
    const legacyData = await SyncStorage.legacy.readLegacyData(idb);
    const marker = readLegacyMigrationMarker();
    if(!legacyData){
      if(marker.claimedBy || marker.declinedBy.length) writeLegacyMigrationMarker(null);
      return;
    }
    // Ya se decidió qué hacer con ellos y falta terminar (p. ej. no había
    // conexión): lo termina la misma cuenta; a otras no se les ofrecen.
    if(marker.claimedBy){
      if(marker.claimedBy === uid) await finishLegacyMigrationIfUploaded(store, false);
      return;
    }
    if(marker.declinedBy.includes(uid)) return;
    const legacySummary = SyncStorage.legacy.summarizeData(legacyData.values);
    if(!legacySummary.hasListData) return;
    // Para ofrecer las opciones correctas hay que saber qué tiene ya la
    // cuenta: solo si la primera sincronización de esta sesión fue bien.
    if(!store.getStatus().lastSyncAt) return;
    const accountValues = await readAccountValues(store);
    const accountSummary = SyncStorage.legacy.summarizeData(accountValues);

    const choice = await showLegacyMigrationDialog(legacySummary, accountSummary);
    if(choice === 'later') return;
    if(choice === 'notMine'){
      marker.declinedBy.push(uid);
      writeLegacyMigrationMarker(marker);
      return;
    }

    // Copia de seguridad ANTES de subir o descartar nada.
    try{ downloadLegacyBackup(legacyData.values); }
    catch(err){
      console.error('No se pudo descargar la copia de seguridad de los datos antiguos', err);
      showToast('No se pudo descargar la copia de seguridad, así que no se ha cambiado nada.');
      return;
    }

    // Reservados para esta cuenta desde ya (por si la subida tiene que
    // esperar a que vuelva la conexión).
    marker.claimedBy = uid;
    writeLegacyMigrationMarker(marker);

    if(choice === 'upload' || choice === 'combine'){
      const values = SyncStorage.legacy.buildMigratedValues(legacyData.values, accountValues, choice);
      for(const key of Object.keys(values)){
        await store.storage.set(key, JSON.stringify(values[key]));
      }
      // El registro local de avisos (solo de este dispositivo) también pasa
      // a la caché de la cuenta, si todavía no tenía uno.
      if(legacyData.values.reminderNotificationLedger && !(await store.storage.get('reminderNotificationLedger'))){
        await store.storage.set('reminderNotificationLedger', JSON.stringify(legacyData.values.reminderNotificationLedger));
      }
    }
    await finishLegacyMigrationIfUploaded(store, true, choice);
  }catch(err){
    console.error('No se pudo completar la migración de los datos antiguos', err);
  }
}

/** Da de baja las notificaciones push de ESTE dispositivo para la cuenta
 * actual. Sin esto, la suscripción seguiría a nombre de esta cuenta y
 * otra persona que entrara después en el mismo dispositivo recibiría sus
 * recordatorios. Primero en el servidor (necesita la sesión, así que va
 * antes de /api/auth/logout) y después en el navegador: aunque el
 * servidor no responda, una suscripción dada de baja en el navegador deja
 * de ser válida y el servidor la elimina en el siguiente envío (404/410,
 * ver api/push/send-due.js). Nunca lanza. */
async function unsubscribePushForThisDevice(){
  try{
    if(typeof navigator === 'undefined' || !('serviceWorker' in navigator)) return;
    const registration = await navigator.serviceWorker.getRegistration();
    if(!registration || !registration.pushManager) return;
    const subscription = await registration.pushManager.getSubscription();
    if(!subscription) return;
    try{
      await fetch('/api/push/unsubscribe', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        credentials:'same-origin',
        body: JSON.stringify({ endpoint: subscription.endpoint }),
      });
    }catch(e){ /* sin red: basta con la baja del navegador, ver arriba */ }
    try{ await subscription.unsubscribe(); }catch(e){}
  }catch(e){ /* best-effort: nunca impide cerrar sesión */ }
}

/** Cerrar sesión: sube lo pendiente (o avisa si no se puede), da de baja
 * el push de este dispositivo, borra la caché local de ESTA cuenta y
 * cierra la sesión en el servidor. Al volver a entrar con otra cuenta no
 * queda nada de esta en el dispositivo. */
async function logout(){
  const store = (typeof SyncStorage !== 'undefined' && SyncStorage) ? SyncStorage.current() : null;
  if(store){
    let allUploaded = false;
    try{ allUploaded = await store.flush(); }catch(e){ allUploaded = false; }
    if(!allUploaded){
      const ok = confirm('Hay cambios que todavía no se han podido subir a tu cuenta (¿sin conexión?). Si cierras sesión ahora, se perderán. ¿Cerrar sesión igualmente?');
      if(!ok) return;
      // Si entre lo que se pierde estaban los datos antiguos que esta
      // cuenta había reservado, se liberan: siguen en la base antigua y se
      // volverán a ofrecer (nunca se borran sin haberse subido).
      const marker = readLegacyMigrationMarker();
      if(currentUser && marker.claimedBy === String(currentUser.id)){
        marker.claimedBy = null;
        writeLegacyMigrationMarker(marker);
      }
    }
  }
  await unsubscribePushForThisDevice();
  // Mismo criterio que importar/borrar datos: el registro de avisos push
  // de este dispositivo no debe pasar a la siguiente cuenta.
  if(typeof self !== 'undefined' && self.SWPushLedger && typeof self.SWPushLedger.clearAll === 'function'){
    try{ await self.SWPushLedger.clearAll(); }catch(e){ console.error('No se pudo reiniciar el ledger persistente de push al cerrar sesión', e); }
  }
  if(store){
    try{ await SyncStorage.deactivate(); }catch(e){}
    try{ await store.destroy(); }catch(e){ console.error('No se pudo borrar la caché local de la cuenta', e); }
  }
  forgetLastUser();
  let loggedOut = false;
  try{
    const res = await fetch('/api/auth/logout', { method:'POST', credentials:'same-origin' });
    loggedOut = res.ok;
  }catch(e){ /* sin red: se termina al volver la conexión, ver init() */ }
  if(!loggedOut) setLogoutPending(true);
  location.reload();
}

/* ==================================================================
   INICIALIZACIÓN
   ================================================================== */
async function startApp(){
  appStarted = true;
  document.getElementById('upcoming-exams').innerHTML = `<div class="empty-state small">Cargando…</div>`;
  const d = new Date();
  cal.year = d.getFullYear(); cal.month = d.getMonth(); cal.selected = todayStr();
  // SYNC: window.storage pasa a ser el de la cuenta ANTES de leer nada.
  if(!(await activateAccountStorage())) return;
  // SYNC: datos de antes de las cuentas en este dispositivo (pregunta al
  // usuario qué hacer con ellos; ver maybeMigrateLegacyData).
  await maybeMigrateLegacyData();
  await loadState();
  initSettingsDataIO();
  initPWA();
  // Recordatorios apagados: limpieza de una vez por cuenta y dispositivo
  // (ver RECORDATORIOS APAGADOS). Sin await: nunca retrasa el arranque.
  disableRemindersOnThisDevice();
  showView(state.prefs.defaultHome || 'inicio');
}

(async function init(){
  initAuthScreen();
  if(isLogoutPending()){
    // Se cerró sesión sin conexión: se termina de cerrar ahora (si hay red)
    // y se pide login, en vez de volver a entrar solo en esa cuenta.
    try{
      const res = await fetch('/api/auth/logout', { method:'POST', credentials:'same-origin' });
      if(res.ok) setLogoutPending(false);
    }catch(e){}
    showAuthScreen();
    return;
  }
  const session = await checkSession();
  if(session.user){
    currentUser = session.user;
    rememberLastUser(session.user);
    hideAuthScreen();
    await startApp();
    return;
  }
  // Sin conexión (o servidor caído): se abre con el último usuario de este
  // dispositivo y su caché; se sincronizará al volver la red. Con un 401
  // real (sesión caducada o cerrada) se pide login.
  const lastUser = session.offline ? readLastUser() : null;
  if(lastUser){
    currentUser = lastUser;
    hideAuthScreen();
    await startApp();
    return;
  }
  if(!session.offline) forgetLastUser();
  showAuthScreen();
})();
</script>
