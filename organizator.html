<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORGANIZATOR</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1B1F23">
<link rel="icon" href="/icons/icon-512.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ORGANIZATOR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F2EE;
    --surface:#FFFFFF;
    --ink:#1B1F23;
    --ink-soft:#63676C;
    --line:#E3E1DB;
    --radius:14px;


    --alta:#C0453B; --media:#C98A22;
  }

  *{box-sizing:border-box;}
  html,body{
    overflow-x:hidden;
  }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk',sans-serif;
    letter-spacing:-0.01em;
  }
  button, input, select, textarea{font-family:inherit;}

  .app{
    display:grid;
    grid-template-columns:76px minmax(0,1fr);
    min-height:100vh;
  }

  /* ---------- Rail de navegación ---------- */
  nav.rail{
    background:var(--surface);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 0;
    gap:4px;
    overflow-y:auto;
  }
  .rail-logo{
    width:34px;height:34px;border-radius:9px;
    background:var(--ink);
    margin-bottom:22px;
    display:flex;align-items:center;justify-content:center;
    color:var(--paper);font-family:'Space Grotesk';font-weight:700;font-size:15px;
    flex:none;
  }
  .rail-item{
    width:56px;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    padding:9px 0;
    border-radius:12px;
    cursor:pointer;
    color:var(--ink-soft);
    position:relative;
    transition:background .15s ease, color .15s ease;
    border:none;
    background:transparent;
  }
  .rail-item .ic{
    width:34px;height:34px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    background:transparent;
  }
  .rail-item .lb{font-size:10px;font-weight:500;}
  .rail-item:hover{background:var(--paper);}
  .rail-item.active{color:var(--ink);}
  .rail-item.active .ic{background:var(--ink);color:var(--paper);}
  .rail-item.settings{margin-top:auto;}

  /* ---------- Menú móvil (hamburguesa) ---------- */
  .menu-toggle{
    display:none;
    position:fixed;top:14px;left:14px;z-index:900;
    width:40px;height:40px;border-radius:10px;
    border:1px solid var(--line);background:var(--surface);
    align-items:center;justify-content:center;
    font-size:18px;cursor:pointer;color:var(--ink);
  }
  .menu-backdrop{
    display:none;
    position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999;
  }

  /* ---------- Contenido central ---------- */
  main{
    padding:40px 44px 60px;
    max-width:820px;
  }
  .view{display:none;}
  .view.active{display:block;}

  .greeting{font-size:13px;color:var(--ink-soft);margin:0 0 2px;font-weight:500;}
  .date{font-size:30px;font-weight:600;margin:0 0 34px;}
  .date .dow{color:var(--ink-soft);font-weight:500;}

  section.block{margin-bottom:38px;}
  .block-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap;}
  .block-head h2{font-size:15px;font-weight:600;margin:0;}
  .block-head .hint{font-size:12px;color:var(--ink-soft);}

  /* UX-7: Ajustes como acordeón — cada categoría (Organización,
     Inteligencia artificial, Recordatorios, Datos y privacidad,
     Información, Cuenta) es una fila-cabecera <button> real (accesible
     por teclado: Tab + Enter/Espacio) que expande/contrae su panel. No
     cambia la estructura de cada section.block existente por dentro —
     solo envuelve su categoría, así que ningún id/selector/listener de
     los controles existentes se ve afectado. */
  .settings-accordion{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
  .settings-accordion-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .settings-accordion-header{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:16px 18px;background:none;border:none;cursor:pointer;font-family:inherit;
    font-size:13px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;
    color:var(--ink);text-align:left;
  }
  .settings-accordion-header:hover{background:var(--paper);}
  .settings-accordion-header:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;}
  .settings-accordion-chevron{font-size:11px;color:var(--ink-soft);transition:transform .18s ease;flex:none;}
  .settings-accordion-header[aria-expanded="true"] .settings-accordion-chevron{transform:rotate(180deg);}
  .settings-accordion-panel{padding:4px 18px 18px;}
  .settings-accordion-panel section.block{margin-bottom:20px;}
  .settings-accordion-panel section.block:last-child{margin-bottom:0;}
  .settings-accordion-panel[hidden]{display:none;}
  /* App de exámenes: lo que se quita de la interfaz se oculta con [hidden] (su código se conserva). */
  .btn[hidden], section.block[hidden], .settings-section[hidden]{display:none !important;}

  .empty-state{
    background:var(--surface);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:26px 24px;
    color:var(--ink-soft);
    font-size:13.5px;
    line-height:1.5;
  }
  .empty-state strong{color:var(--ink);font-weight:600;}
  .empty-state.small{padding:16px 18px;font-size:12.5px;}

  /* ---------- Cabecera de sección ---------- */
  .area-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:30px;}
  .area-head-l{display:flex;align-items:center;gap:14px;}
  .area-head .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;}
  .area-head h1{font-size:24px;font-weight:600;margin:0;}
  .area-head p{font-size:13px;color:var(--ink-soft);margin:2px 0 0;}

  .btn{
    background:var(--surface);border:1px solid var(--line);color:var(--ink);
    font-size:12.5px;font-weight:500;padding:8px 14px;border-radius:9px;cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .btn:hover{border-color:var(--ink-soft);}
  .btn-dark{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .btn-dark:hover{opacity:.9;}
  .btn-ghost{background:transparent;border:none;color:var(--ink-soft);padding:6px 8px;}
  .btn-ghost:hover{color:var(--ink);}
  .btn-sm{padding:5px 9px;font-size:11.5px;border-radius:7px;}

  /* Listas (filas de examen) */
  .item-list{display:flex;flex-direction:column;gap:8px;}
  .event-row{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;display:flex;align-items:flex-start;gap:12px;
  }
  .row-body{flex:1;min-width:0;}
  .row-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .event-title{font-size:13.5px;font-weight:600;}
  .row-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;font-size:11.5px;color:var(--ink-soft);}
  .priority-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .row-notes{font-size:12px;color:var(--ink-soft);margin-top:5px;line-height:1.4;}
  .row-actions{display:flex;gap:2px;flex:none;}

  /* ---------- Ajustes ---------- */
  .settings-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .settings-row:last-child{border-bottom:none;}
  .settings-row .left{display:flex;align-items:center;gap:12px;}
  .toggle{width:34px;height:20px;border-radius:20px;background:var(--line);position:relative;flex:none;cursor:pointer;border:none;padding:0;transition:background .15s ease;}
  .toggle.on{background:var(--ink);}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s ease;}
  .toggle.on::after{left:16px;}
  .settings-row .row-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .settings-row .left.stack{flex-direction:column;align-items:flex-start;gap:2px;}
  .settings-row.select-row{gap:14px;}
  .settings-row select{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;color:var(--ink);background:var(--surface);}
  .settings-row select:focus{outline:2px solid var(--ink);outline-offset:1px;}

  /* ---------- Horarios bloqueados ---------- */
  .schedule-row{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);gap:12px;cursor:pointer;}
  .schedule-row:last-child{border-bottom:none;}
  .schedule-row:hover{background:var(--paper);}
  .schedule-row .sched-main{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .schedule-row .sched-name{font-size:13.5px;font-weight:600;}
  .schedule-row .sched-meta{font-size:11.5px;color:var(--ink-soft);}
  .schedule-row .sched-time{font-size:12.5px;color:var(--ink-soft);font-weight:500;flex:none;}
  .day-pills{display:flex;gap:6px;flex-wrap:wrap;}
  .day-pill{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s ease,color .15s ease,border-color .15s ease;}
  .day-pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .add-schedule-btn{display:block;width:100%;text-align:left;padding:14px 18px;border:none;background:transparent;color:var(--ink-soft);font-size:13px;font-weight:500;cursor:pointer;}
  .add-schedule-btn:hover{background:var(--paper);color:var(--ink);}
  /* Paso 2 (asignaturas): filas con botones propios, paleta de colores y avisos del formulario. */
  .subject-row{cursor:default;}
  .subject-row:hover{background:transparent;}
  .subject-dot{width:10px;height:10px;margin-right:8px;display:inline-block;vertical-align:middle;}
  .subject-actions{display:flex;gap:6px;flex:none;}
  .color-swatches{display:flex;flex-wrap:wrap;gap:8px;}
  .color-swatch{position:relative;cursor:pointer;}
  .color-swatch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
  .color-swatch span{display:block;width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);}
  .color-swatch input:checked + span{outline:2px solid var(--ink);outline-offset:2px;}
  .color-swatch input:focus-visible + span{outline:2px dashed var(--ink);outline-offset:2px;}
  .form-group label.checkbox-row{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;margin:0;}
  .form-group .checkbox-row input{width:18px;height:18px;margin:0;padding:0;flex:none;}
  .color-custom-row{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--ink-soft);}
  .color-custom-row input[type=color]{width:44px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;}
  .form-error{font-size:12px;color:var(--alta);margin-top:4px;}
  .form-error:empty,.form-warning:empty{display:none;}
  .form-group[hidden]{display:none;}
  .form-warning{font-size:12px;color:var(--media);margin-top:6px;}
  /* Vista Horario: lunes a viernes de 8:00 a 14:30 en filas de media hora.
     En el ordenador ocupa todo el ancho; en el móvil en vertical se ve un
     día cada vez (pestañas L M X J V) y en horizontal la semana entera. */
  main:has(#view-horario.active){max-width:none;}
  /* Calendario sin barra lateral: usa ese espacio. */
  main:has(#view-calendario.active){max-width:1240px;}
  .horario-wrap{overflow-x:auto;}
  .horario-grid{display:grid;grid-template-columns:52px repeat(5,minmax(90px,1fr));min-width:500px;}
  .horario-day-name{font-size:13px;font-weight:600;text-align:center;padding:6px 0;margin:0 3px 8px;border-radius:8px;color:var(--ink-soft);}
  .horario-day-name.today{background:var(--ink);color:var(--paper);}
  .horario-day-short{display:none;}
  .horario-hours{position:relative;}
  .horario-hour{position:absolute;right:8px;font-size:11px;line-height:1;color:var(--ink-soft);transform:translateY(-5px);opacity:.75;}
  .horario-hour.is-hour{font-size:12px;font-weight:600;color:var(--ink);opacity:1;}
  .horario-col{position:relative;background:var(--surface);border-left:1px solid var(--line);border-bottom:1px solid var(--line);}
  .horario-col:last-child{border-right:1px solid var(--line);}
  .horario-col.today{background:color-mix(in srgb, var(--ink) 6%, var(--surface));}
  .horario-slot{position:absolute;left:0;width:100%;box-sizing:border-box;border:none;border-top:1px dashed var(--line);background:transparent;padding:0;cursor:pointer;}
  .horario-slot.is-hour{border-top-style:solid;}
  .horario-slot:hover{background:rgba(0,0,0,.04);}
  .horario-slot:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;}
  .horario-class{position:absolute;z-index:1;box-sizing:border-box;border:none;border-left:4px solid;border-radius:8px;padding:5px 7px;text-align:left;cursor:pointer;overflow:hidden;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:2px;}
  .horario-class:focus-visible{outline:2px solid var(--ink);outline-offset:1px;}
  .horario-class-name{font-size:14.5px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;}
  .horario-class-time{font-size:12px;line-height:1.2;opacity:.9;white-space:nowrap;}
  .horario-break .horario-class-name{font-weight:600;font-style:italic;}
  .horario-hint{font-size:12px;color:var(--ink-soft);margin:10px 0 0;}
  .horario-tabs{display:none;gap:6px;margin-bottom:12px;}
  .horario-tab{flex:1;font:inherit;font-size:14px;font-weight:600;padding:9px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;}
  .horario-tab.today{border-color:var(--ink);}
  .horario-tab.is-selected{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  @media (max-width:640px) and (orientation:portrait){
    .horario-tabs{display:flex;}
    .horario-grid{grid-template-columns:52px 1fr;min-width:0;}
    .horario-day-name:not(.is-selected), .horario-col:not(.is-selected){display:none;}
  }
  @media (max-height:500px) and (orientation:landscape){
    .horario-grid{grid-template-columns:44px repeat(5,minmax(70px,1fr));min-width:0;}
    .horario-day-full{display:none;}
    .horario-day-short{display:inline;}
  }
  .btn-danger{border-color:var(--alta);color:var(--alta);}
  .btn-danger:hover{background:var(--alta);color:var(--surface);}
  .settings-actions{display:flex;flex-wrap:wrap;gap:10px;}
  .app-info-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;font-size:13px;color:var(--ink-soft);line-height:1.6;}
  .app-info-box strong{color:var(--ink);}
  .hour-row{display:flex;align-items:center;gap:10px;}
  .hour-row select{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;}

  /* ---------- Calendario ---------- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .cal-head h1{font-size:22px;font-weight:600;margin:0;}
  .cal-nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;row-gap:6px;}
  .cal-nav button{
    width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
    cursor:pointer;color:var(--ink);font-size:14px;display:flex;align-items:center;justify-content:center;
  }
  .cal-nav button:hover{border-color:var(--ink-soft);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:26px;}

  .cal-dow{font-size:10.5px;color:var(--ink-soft);text-align:center;font-weight:600;padding-bottom:4px;}
  .cal-cell{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    min-height:74px;padding:7px;cursor:pointer;display:flex;flex-direction:column;gap:5px;
    transition:border-color .15s ease;
  }
  .cal-cell:hover{border-color:var(--ink-soft);}
  .cal-cell.empty{background:transparent;border-color:transparent;cursor:default;}
  .cal-cell.today{border-color:var(--ink);border-width:1.5px;}
  .cal-cell.selected{background:var(--paper);}
  .cal-daynum{font-size:12px;font-weight:600;}
  .cal-more{font-size:9.5px;color:var(--ink-soft);}
  /* App de exámenes: exámenes y entregas en su día, con el color de su asignatura. */
  .cal-cell{min-width:0;}
  /* Inicio: próximo examen o entrega (grande) y los siguientes. */
  .next-exam{display:flex;align-items:center;gap:18px;width:100%;box-sizing:border-box;text-align:left;cursor:pointer;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:6px solid;border-radius:14px;padding:16px 18px;}
  .next-exam:hover{border-color:var(--ink-soft);}
  .next-exam-count{flex:none;min-width:76px;box-sizing:border-box;padding:12px 10px;border-radius:12px;display:flex;flex-direction:column;align-items:center;text-align:center;}
  .next-exam-num{font-size:36px;font-weight:700;line-height:1;}
  .next-exam-unit{font-size:12px;margin-top:2px;}
  .next-exam-word{font-size:22px;font-weight:700;line-height:1.1;}
  .next-exam-body{min-width:0;display:flex;flex-direction:column;gap:3px;}
  .next-exam-kicker{font-size:12px;color:var(--ink-soft);}
  .next-exam-title{font-size:17px;font-weight:600;overflow-wrap:anywhere;}
  .next-exam-date{font-size:13px;color:var(--ink-soft);}
  .upcoming-head{font-size:12px;font-weight:600;color:var(--ink-soft);margin:18px 0 8px;}
  .upcoming-list{display:flex;flex-direction:column;gap:6px;}
  .upcoming-row{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;text-align:left;cursor:pointer;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .upcoming-row:hover{border-color:var(--ink-soft);}
  .upcoming-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .upcoming-title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .upcoming-meta{font-size:12px;color:var(--ink-soft);overflow-wrap:anywhere;}
  .upcoming-days{flex:none;font-size:12px;font-weight:600;white-space:nowrap;padding:4px 9px;border-radius:999px;}
  .upcoming-more{font-size:12px;color:var(--ink-soft);margin:8px 0 0;}
  /* Notas: una tarjeta por asignatura, con sus tres trimestres. */
  /* Notas: cada asignatura y cada trimestre es un desplegable (<details>). */
  details.block.notas-subject{background:var(--surface);border:1px solid var(--line);border-left:6px solid;border-radius:14px;padding:0;margin-bottom:12px;}
  .notas-subject-head, .notas-term-head{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .notas-subject-head::-webkit-details-marker, .notas-term-head::-webkit-details-marker{display:none;}
  .notas-subject-head::before, .notas-term-head::before{content:'▸';color:var(--ink-soft);font-size:12px;transition:transform .15s ease;}
  details[open] > .notas-subject-head::before, details[open] > .notas-term-head::before{transform:rotate(90deg);}
  .notas-subject-head{padding:14px 18px;}
  .notas-subject-name{flex:1;min-width:0;font-size:16px;font-weight:600;}
  .notas-subject-sum{font-size:13px;color:var(--ink-soft);white-space:nowrap;}
  .notas-subject-sum strong{color:var(--ink);}
  .notas-terms{display:flex;flex-direction:column;gap:8px;padding:0 18px 16px;}
  .notas-term{background:var(--paper);border-radius:10px;min-width:0;}
  .notas-term-head{font-size:13px;font-weight:600;padding:10px 12px;}
  .notas-term-head > span:first-of-type{flex:1;}
  .notas-now{font-weight:500;color:var(--ink-soft);}
  .notas-term-avg{font-size:13px;}
  .notas-term-body{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px;}
  .notas-empty{font-size:12px;color:var(--ink-soft);}
  .notas-exam{display:flex;align-items:center;gap:10px;}
  .notas-exam-main{flex:1;min-width:0;}

    .area-head, .cal-head, .day-panel-head, .settings-row, .schedule-row,

      flex-wrap:wrap;
      row-gap:8px;
    }

</style>
</head>

<!-- Polyfill de window.storage con IndexedDB — debe cargarse ANTES del script
     principal para que loadState() ya lo encuentre disponible fuera de Claude. -->
<script src="/js/storage-polyfill.js"></script>

<!-- SYNC: datos de la app asociados a la cuenta. sync-storage.js sustituye
     window.storage (tras iniciar sesión, ver activateAccountStorage más
     abajo) por una caché local POR USUARIO que se sincroniza con
     /api/data; sync-merge.js es la fusión que usa en caso de conflicto
     (debe cargarse antes que sync-storage.js). -->
<script src="/js/sync-merge.js"></script>
<script src="/js/sync-storage.js"></script>

<!-- R-8.2-D: ledger persistente (IndexedDB propio, independiente de
     window.storage) de qué reminderId ya mostró un push el Service
     Worker — el MISMO archivo que carga sw.js vía importScripts, para
     que ambos realms compartan una única implementación. La página solo
     lo vacía (al importar, borrar los datos o cerrar sesión); si falla al
     cargar, window.SWPushLedger no existe y esas llamadas no hacen nada. -->
<script src="/js/sw-push-ledger.js"></script>

<!-- Duration Learning (aprendizaje de duración real de tareas): debe
     cargarse antes que scheduler.js para que Scheduler.estimateDuration()
     ya encuentre window.DurationLearning disponible como segunda fuente
     de estimación (tras estimatedMinutes y antes del fallback por
     prioridad). Si esta línea faltara o el script fallara al cargar,
     Scheduler sigue funcionando igual que antes (detecta su ausencia). -->
<script src="/js/duration-learning.js"></script>

<!-- Scheduler (algoritmo de huecos libres). -->
<script src="/js/scheduler.js"></script>

<script>
/* ==================================================================
   CONFIGURACIÓN
   ================================================================== */
const DOW_NAMES = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DOW_SHORT = ['L','M','X','J','V','S','D'];
// Nombres completos en el mismo orden que DOW_SHORT (0=Lunes...6=Domingo), usados para el contexto de la IA
const DOW_FULL_MONFIRST = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const MONTH_NAMES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* ==================================================================
   AJUSTES — valores por defecto
   ================================================================== */
const APP_NAME = 'ORGANIZATOR';
const APP_VERSION = '2.3.23';
function defaultPrefs(){
  return {
    defaultHome: 'inicio',        // vista con la que arranca la app: 'inicio' o 'calendario'
    showCompletedTasks: true,     // mostrar tareas ya completadas
    showPastEvents: true,         // mostrar eventos ya pasados
    calendarView: 'month',        // vista de calendario predeterminada (de momento solo existe 'month')
    dayStartHour: 8,              // primera hora del día, para futuras vistas por horas
    dayEndHour: 22,               // última hora del día, para futuras vistas por horas
    studyDaysBefore: 10,          // días de estudio antes de un examen (cada prueba puede cambiarlo)
  };
}
function defaultIA(){
  return {
    enabled: true, // futuras preferencias de IA se añadirán aquí sin romper compatibilidad
  };
}

/* ==================================================================
   ESTADO
   ================================================================== */
let state = {
  tasks: [], events: [],
  customSchedules: [],
  eventCategories: [], // Fase 6A-3: categorías configurables para eventos (color + blocksSchedule)
  reminders: [], // recordatorios de tareas/eventos — estructura de datos mínima (Fase 1, sin notificaciones todavía)
  // R-8.2-C: registro de reconciliación local↔Web Push, SEPARADO del
  // modelo funcional de reminders — {[reminderId]: timestampMs}. Nunca
  // sustituye reminder.status ni forma parte de su modelo (ver bloque
  // RECORDATORIOS — reconciliación local↔Web Push más abajo).
  reminderNotificationLedger: {},
  // App de exámenes (paso 1, solo modelo de datos): asignaturas, exámenes/
  // entregas y sesiones del plan de estudio. Ver STUDY_KEYS en ALMACENAMIENTO.
  subjects: [], exams: [], studySessions: [],
  prefs: defaultPrefs(),
  ia: defaultIA(),
};
window.state = state; // necesario para que js/ai-actions.js (archivo aparte) pueda leer/escribir el mismo state
let currentView = 'inicio';
let cal = { year:0, month:0, selected:null };

/* ==================================================================
   UTILIDADES DE FECHA
   ================================================================== */
function pad(n){ return String(n).padStart(2,'0'); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function nowTimeStr(){ const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function parseYMD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y, m-1, d); }
function humanDate(s){
  if(!s) return '';
  const d = parseYMD(s);
  return `${d.getDate()} de ${MONTH_NAMES[d.getMonth()]}`;
}
function humanDateShort(s){
  if(!s) return '';
  const d = parseYMD(s);
  return `${DOW_SHORT[(d.getDay()+6)%7]}, ${d.getDate()} ${MONTH_NAMES[d.getMonth()].slice(0,3)}`;
}
function isDateInRange(dateStr, start, end){
  if(!end) return dateStr === start;
  return dateStr >= start && dateStr <= end;
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ==================================================================
   HORARIOS BLOQUEADOS (bloques de rutina definidos por el usuario)
   Cada bloque: { id, name, days:[0..6] (0=Lunes...6=Domingo, igual que DOW_SHORT), startTime:"HH:MM", endTime:"HH:MM", subjectId, inHorario }
   subjectId (opcional): el bloque es una clase de esa asignatura;
   su nombre se copia del de la asignatura (así la IA y el planificador lo
   siguen viendo por s.name) y en la vista Horario se pinta con su color.
   inHorario (opcional): bloque sin asignatura creado desde la vista Horario
   (p. ej. el recreo); sale en esa tabla, a diferencia del resto de bloques.
   ================================================================== */
/** Asignatura de un bloque de horario, o null si no tiene (o ya no existe). */
function scheduleSubject(s){
  return (s && s.subjectId && state.subjects.find(x => x.id === s.subjectId)) || null;
}
async function addCustomSchedule(data){
  state.customSchedules.push({ id: uid(), name: data.name, days: data.days, startTime: data.startTime, endTime: data.endTime, subjectId: data.subjectId || null, inHorario: !!data.inHorario, createdAt: Date.now() });
  await saveCustomSchedules();
}
async function updateCustomSchedule(id, data){
  const s = state.customSchedules.find(x=>x.id===id);
  if(!s) return;
  s.name = data.name; s.days = data.days; s.startTime = data.startTime; s.endTime = data.endTime; s.subjectId = data.subjectId || null;
  if(Object.prototype.hasOwnProperty.call(data, 'inHorario')) s.inHorario = !!data.inHorario;
  await saveCustomSchedules();
}
async function deleteCustomSchedule(id){
  state.customSchedules = state.customSchedules.filter(x=>x.id!==id);
  await saveCustomSchedules();
}
function dowOfDate(dateStr){
  // Convierte una fecha YYYY-MM-DD al mismo índice de día que usa DOW_SHORT (0=Lunes...6=Domingo)
  return (parseYMD(dateStr).getDay() + 6) % 7;
}
function schedulesForDow(dow){
  return state.customSchedules
    .filter(s => Array.isArray(s.days) && s.days.includes(dow))
    .sort((a,b) => (a.startTime||'').localeCompare(b.startTime||''));
}

/* ==================================================================
   FECHAS — sumar días y lunes de la semana
   Reutiliza parseYMD/pad/dowOfDate ya existentes; nada de esto pinta UI.
   ================================================================== */
function addDays(dateStr, n){
  // Suma (o resta, con n negativo) días a una fecha YYYY-MM-DD sin problemas
  // de zona horaria: parseYMD crea la fecha en horario local a medianoche,
  // y Date#setDate ya gestiona correctamente los saltos de mes/año.
  const d = parseYMD(dateStr);
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function getWeekMonday(dateStr){
  // Lunes de la semana que contiene dateStr (dowOfDate: 0=Lunes...6=Domingo)
  return addDays(dateStr, -dowOfDate(dateStr));
}

/* ==================================================================
   ALMACENAMIENTO (persistente, personal — no compartido)
   ================================================================== */
async function loadState(){
  try{
    const t = await window.storage.get('tasks', false);
    state.tasks = t ? JSON.parse(t.value) : [];
  }catch(e){ state.tasks = []; }
  try{
    const e = await window.storage.get('events', false);
    state.events = e ? JSON.parse(e.value) : [];
  }catch(e){ state.events = []; }
  try{
    const cs = await window.storage.get('customSchedules', false);
    state.customSchedules = cs ? JSON.parse(cs.value) : [];
  }catch(e){ state.customSchedules = []; }
  try{
    const ec = await window.storage.get('eventCategories', false);
    state.eventCategories = ec ? JSON.parse(ec.value) : [];
  }catch(e){ state.eventCategories = []; }
  try{
    const r = await window.storage.get('reminders', false);
    state.reminders = r ? JSON.parse(r.value) : [];
  }catch(e){ state.reminders = []; }
  try{
    const rnl = await window.storage.get('reminderNotificationLedger', false);
    state.reminderNotificationLedger = rnl ? JSON.parse(rnl.value) : {};
  }catch(e){ state.reminderNotificationLedger = {}; }
  for(const key of STUDY_KEYS){
    try{
      const s = await window.storage.get(key, false);
      const value = s ? JSON.parse(s.value) : [];
      state[key] = Array.isArray(value) ? value : [];
    }catch(e){ state[key] = []; }
  }
  // Ajustes: se cargan por separado y se combinan con los valores por defecto,
  // así si en el futuro se añaden más claves no se rompe con datos antiguos.

/* ---------- App de exámenes: modelo de datos (paso 1) ----------
   Tres listas sincronizadas con la cuenta (sql/005_study_keys.sql):
   - subjects: { id, name, color, passGrade (nota mínima de aprobado, 5 por
       defecto), createdAt, updatedAt }
   - exams (exámenes y entregas): { id, subjectId, type (EXAM_TYPE_INFO),
       title, date, time|null, durationMinutes|null, term: 1|2|3|null,
       weight (% de la nota; por defecto el de su tipo), topics: [{ id, name }],
       difficulty: 1-5,
       studyDaysBefore|null (solo pruebas: días de estudio solo para esta;
         null = prefs.studyDaysBefore),
       deliveryStatus: 'pendiente'|'entregado'|null (solo entregas),
       recovers: { examId } | { term } | null (solo recuperación: la prueba
         o el trimestre que recupera; su nota SUSTITUYE a la de lo
         recuperado si es mayor, no suma con peso propio),
       grade|null, notes, createdAt, updatedAt }
   - studySessions: { id, examId, subjectId, date, startTime|null,
       plannedMinutes, kind: 'estudio'|'repaso'|'trabajo'|'ensayo', topicIds: [],
       status: 'pendiente'|'hecha'|'saltada', actualMinutes|null,
       completedAt|null, createdAt, updatedAt }
   Todo elemento lleva `id`: js/sync-merge.js fusiona las listas por id.
   Grupos de tipos: 'prueba' se estudia en una ventana de días antes de la
   fecha (examStudyDays); 'entrega' tiene estado pendiente/entregado y se
   trabaja desde que se apunta hasta la fecha de entrega. */
const STUDY_KEYS = ['subjects', 'exams', 'studySessions'];
const EXAM_TYPE_INFO = {
  examen:       { label: 'Examen',                   group: 'prueba',  weight: 20 },
  parcial:      { label: 'Parcial',                  group: 'prueba',  weight: 30 },
  trimestral:   { label: 'Trimestral',               group: 'prueba',  weight: 40 },
  final:        { label: 'Final',                    group: 'prueba',  weight: 50 },
  recuperacion: { label: 'Recuperación',             group: 'prueba',  weight: 0 }, // sustituye, no suma (ver recovers)
  trabajo:      { label: 'Trabajo',                  group: 'entrega', weight: 15 },
  exposicion:   { label: 'Exposición',               group: 'entrega', weight: 10 },
  ejercicios:   { label: 'Ejercicios para entregar', group: 'entrega', weight: 10 },
  deberes:      { label: 'Deberes',                  group: 'entrega', weight: 5 },
};
const EXAM_TYPES = Object.keys(EXAM_TYPE_INFO);
const EXAM_TERMS = [1, 2, 3];
const EXAM_DELIVERY_STATUSES = ['pendiente', 'entregado'];
const DEFAULT_PASS_GRADE = 5;
const STUDY_SESSION_KINDS = ['estudio', 'repaso', 'trabajo', 'ensayo']; // ensayo: el día antes de una exposición
const STUDY_SESSION_STATUSES = ['pendiente', 'hecha', 'saltada'];
// Paleta de colores de las asignaturas: 20 colores bien distintos, todos con
// contraste >= 3:1 sobre el fondo claro de la app (se ven como punto o
// borde). Los 10 primeros son los de siempre, así una asignatura nueva
// recibe primero los más distintos. Además se puede elegir "Otro color"
// libre; el texto encima de un color va en blanco o negro (textColorOn).
const SUBJECT_COLORS = [
  { name: 'Rojo',      color: '#D64545' },
  { name: 'Naranja',   color: '#C4621A' },
  { name: 'Mostaza',   color: '#A07800' },
  { name: 'Verde',     color: '#3A9149' },
  { name: 'Turquesa',  color: '#118A84' },
  { name: 'Azul',      color: '#3A7BD5' },
  { name: 'Índigo',    color: '#5B63D6' },
  { name: 'Violeta',   color: '#8E57D1' },
  { name: 'Rosa',      color: '#D14E8E' },
  { name: 'Marrón',    color: '#9C6B3E' },
  { name: 'Granate',   color: '#A3263B' },
  { name: 'Coral',     color: '#DB5A2B' },
  { name: 'Ámbar',     color: '#A86A00' },
  { name: 'Oliva',     color: '#6F8A1F' },
  { name: 'Esmeralda', color: '#16875F' },
  { name: 'Cian',      color: '#1680A6' },
  { name: 'Marino',    color: '#24509A' },
  { name: 'Púrpura',   color: '#7340A8' },
  { name: 'Fucsia',    color: '#AE2BA6' },
  { name: 'Pizarra',   color: '#5E7183' },
];
const HEX_COLOR_RE = /^#[0-9A-Fa-f]{6}$/;

/** Blanco o negro, el que mejor se lea encima de `hex` (contraste WCAG).
 * Con un color no válido, negro. */
function textColorOn(hex){
  if(!HEX_COLOR_RE.test(String(hex || ''))) return '#000000';
  const lin = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map(v => v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
  const L = 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2];
  return (1.05 / (L + 0.05)) >= ((L + 0.05) / 0.05) ? '#FFFFFF' : '#000000';
}

/** Nota de aprobado a partir de lo que escribe el usuario ("4,5", "4.5",
 * 5...). Devuelve un número de 0 a 10 redondeado a 2 decimales, o null si
 * no es una nota válida. */
function parsePassGrade(value){
  if(typeof value === 'number') return Number.isFinite(value) && value >= 0 && value <= 10 ? Math.round(value * 100) / 100 : null;
  if(typeof value !== 'string') return null;
  const text = value.trim().replace(',', '.');
  if(!/^\d+(\.\d+)?$/.test(text)) return null;
  return parsePassGrade(Number(text));
}

/** Peso por defecto (% de la nota) de un tipo de prueba; 0 si el tipo no
 * existe y para la recuperación (sustituye una nota, no suma). */
function defaultExamWeight(type){
  return Object.prototype.hasOwnProperty.call(EXAM_TYPE_INFO, type) ? EXAM_TYPE_INFO[type].weight : 0;
}
/** true para examen, parcial, trimestral, final y recuperación. */
function isStudyWindowType(type){
  return Object.prototype.hasOwnProperty.call(EXAM_TYPE_INFO, type) && EXAM_TYPE_INFO[type].group === 'prueba';
}
/** true para trabajo, exposición, ejercicios y deberes (estado pendiente/entregado). */
function isDeliveryType(type){
  return Object.prototype.hasOwnProperty.call(EXAM_TYPE_INFO, type) && EXAM_TYPE_INFO[type].group === 'entrega';
}
/** Valida el campo `recovers` de una recuperación: { examId } con un id de
 * texto no vacío, o { term } con 1, 2 o 3. Cualquier otra cosa -> null.
 * Nunca lanza ni modifica `value`. */
function sanitizeRecovers(value){
  if(!value || typeof value !== 'object') return null;
  if(typeof value.examId === 'string' && value.examId.trim()) return { examId: value.examId };
  if(EXAM_TERMS.includes(value.term)) return { term: value.term };
  return null;
}
/** Días de estudio antes de una prueba: los suyos si los tiene (entero >= 1),
 * si no los de Ajustes (prefs.studyDaysBefore, 10 por defecto). null para
 * las entregas, que no usan ventana de estudio. */
function examStudyDays(exam, prefs){
  if(!exam || !isStudyWindowType(exam.type)) return null;
  const valid = n => Number.isInteger(n) && n >= 1;
  if(valid(exam.studyDaysBefore)) return exam.studyDaysBefore;
  return valid(prefs && prefs.studyDaysBefore) ? prefs.studyDaysBefore : 10;
}

/* ==================================================================
   RECORDATORIOS — cancelar en el servidor (Web Push)
   Los recordatorios locales ya no existen (app de exámenes). Esto queda
   solo para la limpieza de abajo (RECORDATORIOS APAGADOS), que cancela en
   el servidor los avisos que quedaran pendientes de versiones anteriores.
   ================================================================== */
/** Cancela el equivalente server-side de un reminder vía POST
 * /api/push/cancel-reminder. Best-effort e idempotente: un fallo se
 * registra con console.warn y se resuelve a { ok:false } sin lanzar. */
async function cancelReminderPush(reminderId){
  if(!reminderId) return { ok:false, reason:'no-id' };
  try{
    const res = await fetch('/api/push/cancel-reminder', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ reminderId }),
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return { ok:true };
  }catch(e){
    console.warn('No se pudo cancelar el recordatorio en Web Push (el recordatorio local sigue cancelado)', e);
    return { ok:false, reason:'network-or-server-error' };
  }
}

/* ==================================================================
   RECORDATORIOS APAGADOS (app de exámenes)
   Los recordatorios locales ya no existen. Una vez por cuenta y
   dispositivo, startApp() cancela en el servidor los avisos que quedaran
   pendientes y da de baja este dispositivo. state.reminders no se toca
   (los datos se siguen sincronizando y exportando). El servidor tiene su
   propio interruptor (api/push/send-due.js), que es el que garantiza que
   no llegue nada al móvil aunque haya una versión vieja de la app.
   ================================================================== */
const REMINDERS_OFF_CLEANUP_KEY = 'organizator:remindersOffCleanup:v1';
/** Limpieza de una sola vez (por cuenta y dispositivo). Si algo falla (sin
 * red), se reintenta en el siguiente arranque. Nunca lanza. */
async function disableRemindersOnThisDevice(){
  try{
    const key = `${REMINDERS_OFF_CLEANUP_KEY}:${currentUser && currentUser.id != null ? currentUser.id : 'anon'}`;
    try{ if(localStorage.getItem(key)) return { ok:true, skipped:true }; }catch(e){}
    const pending = (state.reminders || []).filter(r => r && r.status === 'pending');
    let failed = 0;
    for(const r of pending){
      const res = await cancelReminderPush(r.id);
      if(!res || !res.ok) failed++;
    }
    await unsubscribePushForThisDevice();
    if(failed === 0){ try{ localStorage.setItem(key, String(Date.now())); }catch(e){} }
    return { ok: failed === 0, cancelled: pending.length - failed };
  }catch(e){
    return { ok:false };
  }
}
